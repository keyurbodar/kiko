[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
kiko-driver = { path = "crates/kiko-driver" }
atspi = { version = "0.30", default-features = false, features = ["proxies", "wrappers", "tokio", "zbus"] }
atspi-connection = { version = "0.14", default-features = false, features = ["wrappers"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
x11rb = { version = "0.13", features = ["composite", "xtest"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
