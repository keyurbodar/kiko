[package]
name = "kiko-app"
description = "The kiko desktop app: menu bar, desktop driver and daemon supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kiko_app"
path = "src/lib.rs"

[[bin]]
name = "kiko"
path = "src/main.rs"

[features]
default = []
# Turn on once the driver crates exist. Wiring is these four lines, then this feature:
#   kiko-browser = { path = "../kiko-browser", optional = true }
#   kiko-native-macos = { path = "../kiko-native-macos", optional = true }    (macOS)
#   kiko-native-windows = { path = "../kiko-native-windows", optional = true } (Windows)
#   kiko-native-linux = { path = "../kiko-native-linux", optional = true }    (Linux)
#   drivers = ["dep:kiko-browser", "dep:kiko-native-macos", "dep:kiko-native-windows", "dep:kiko-native-linux"]
drivers = []

[dependencies]
kiko-driver.workspace = true
serde.workspace = true
serde_json.workspace = true
fd-lock = "4"
dirs = "7"
interprocess = "2"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.21"
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
winreg = "0.55"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
