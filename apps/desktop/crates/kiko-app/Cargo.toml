[package]
name = "kiko-app"
description = "The kiko desktop app: menu bar, desktop driver and daemon supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kiko_app"
path = "src/lib.rs"

[[bin]]
name = "kiko"
path = "src/main.rs"

[dependencies]
kiko-driver.workspace = true
serde.workspace = true
serde_json.workspace = true
fd-lock = "4"
dirs = "7"
interprocess = "2"
png = "0.18"
kiko-browser = { path = "../kiko-browser" }
kiko-cua = { path = "../kiko-cua" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
tao = "0.37"
tray-icon = "0.26"
