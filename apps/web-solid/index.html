<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" />
    <title>Kiko</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      ;(function () {
        var d = document.documentElement,
          boot = {},
          mode = "dark"
        /* boot-palettes:start */
        ;(function () {
          var PALETTE_KEYS = [
              "canvas",
              "sidebar",
              "text",
              "muted",
              "faint",
              "action",
              "actionHover",
              "onAction",
              "danger",
              "gold",
            ],
            DARK_THEME_IDS = ["kiko", "glacier", "slate", "graphite", "moss", "tide", "dusk", "plum"],
            THEME_IDS = [...DARK_THEME_IDS, "snow"],
            DEFAULT_DARK_THEME = "kiko"
          var THEMES = {
            kiko: {
              label: "Kiko",
              accent: "#5b9cf6",
              palette: {
                canvas: "#161616",
                sidebar: "#1c1c1c",
                text: "#f2f2f2",
                muted: "#ababab",
                faint: "#8c8c8c",
                action: "#f2f2f2",
                actionHover: "#ffffff",
                onAction: "#141414",
                danger: "#ef6a6a",
                gold: "#e8c47b",
              },
            },
            glacier: {
              label: "Glacier",
              accent: "#96c8eb",
              palette: {
                canvas: "#08131c",
                sidebar: "#101a24",
                text: "#e7f0f6",
                muted: "#a5b7c4",
                faint: "#8798a4",
                action: "#e7f0f6",
                actionHover: "#96c8eb",
                onAction: "#08131c",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            slate: {
              label: "Slate",
              accent: "#becde1",
              palette: {
                canvas: "#0c0d10",
                sidebar: "#121418",
                text: "#e9ecf0",
                muted: "#9298a2",
                faint: "#787d86",
                action: "#e9ecf0",
                actionHover: "#becde1",
                onAction: "#0c0d10",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            graphite: {
              label: "Graphite",
              accent: "#dcdcdc",
              palette: {
                canvas: "#0c0c0c",
                sidebar: "#131313",
                text: "#ededed",
                muted: "#959595",
                faint: "#7b7b7b",
                action: "#ededed",
                actionHover: "#dcdcdc",
                onAction: "#0c0c0c",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            moss: {
              label: "Moss",
              accent: "#86a38d",
              palette: {
                canvas: "#0a0e0c",
                sidebar: "#0f1512",
                text: "#e8efe9",
                muted: "#8fa196",
                faint: "#76857c",
                action: "#e8efe9",
                actionHover: "#86a38d",
                onAction: "#0a0e0c",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            tide: {
              label: "Tide",
              accent: "#78afc8",
              palette: {
                canvas: "#080c10",
                sidebar: "#0c1318",
                text: "#e6eff3",
                muted: "#8a9ea8",
                faint: "#71828b",
                action: "#e6eff3",
                actionHover: "#78afc8",
                onAction: "#080c10",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            dusk: {
              label: "Dusk",
              accent: "#e6aa82",
              palette: {
                canvas: "#0f0c0b",
                sidebar: "#181311",
                text: "#f1ebe6",
                muted: "#a59a92",
                faint: "#887f78",
                action: "#f1ebe6",
                actionHover: "#e6aa82",
                onAction: "#0f0c0b",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            plum: {
              label: "Plum",
              accent: "#afa0dc",
              palette: {
                canvas: "#0d0c11",
                sidebar: "#14121a",
                text: "#ece9f2",
                muted: "#9a95a6",
                faint: "#7f7b8a",
                action: "#ece9f2",
                actionHover: "#afa0dc",
                onAction: "#0d0c11",
                danger: "#ffb4ac",
                gold: "#e8c47b",
              },
            },
            snow: {
              label: "Paper",
              accent: "#2f6fe4",
              palette: {
                canvas: "#ffffff",
                sidebar: "#f5f5f5",
                text: "#141414",
                muted: "#474747",
                faint: "#666666",
                action: "#141414",
                actionHover: "#000000",
                onAction: "#ffffff",
                danger: "#d6453f",
                gold: "#a86b00",
              },
            },
          }
          function paletteFor(mode, darkTheme = "kiko") {
            return THEMES[mode === "light" ? "snow" : darkTheme].palette
          }
          var PALETTES = { light: paletteFor("light"), dark: paletteFor("dark") },
            round = (n, places) => Math.round(n * 10 ** places) / 10 ** places,
            ROLES = [
              ["--bg", ({ p }) => p.canvas],
              ["--side", ({ p }) => p.sidebar],
              ["--panel", ({ solid, dark }) => solid(dark ? 4 : 1.8)],
              ["--raise", ({ solid, dark }) => solid(dark ? 7 : 3)],
              ["--hover", ({ solid, dark }) => solid(dark ? 9.5 : 5)],
              ["--active", ({ solid, dark }) => solid(dark ? 14 : 8)],
              ["--tip", ({ solid, dark }) => solid(dark ? 16 : 7)],
              ["--me", ({ solid, dark }) => solid(dark ? 9 : 6)],
              ["--kiko-bubble", ({ solid, dark }) => solid(dark ? 4 : 3)],
              ["--line", ({ solid, dark }) => solid(dark ? 10 : 9)],
              ["--line2", ({ solid, dark }) => solid(dark ? 16 : 14)],
              ["--fg", ({ p }) => p.text],
              ["--fg2", ({ p }) => p.muted],
              ["--fg3", ({ p }) => p.faint],
              ["--fg4", ({ solid, dark }) => solid(dark ? 38 : 34)],
              ["--on-fg", ({ p }) => p.onAction],
              ["--ok", ({ dark }) => (dark ? "#5cc489" : "#1f9d55")],
              ["--bad", ({ p }) => p.danger],
              ["--warn", ({ p }) => p.gold],
              ["--info", ({ accent }) => accent],
              ["--leaf", ({ dark }) => (dark ? "#7fd19c" : "#2f9e5b")],
              ["--info-wash", ({ accent, dark }) => `color-mix(in oklab, ${accent} ${dark ? 14 : 11}%, transparent)`],
              ["--bad-wash", ({ p }) => `color-mix(in oklab, ${p.danger} 12%, transparent)`],
              ["--scrollbar-thumb", ({ clear }) => clear(18)],
              ["--scrollbar-thumb-hover", ({ clear }) => clear(30)],
              [
                "--card-shadow",
                ({ clear, dark }) =>
                  dark
                    ? "inset 0 1px 0 rgb(255 255 255 / 3%)"
                    : `0 0 0 1px ${clear(6)}, 0 1px 2px rgb(0 0 0 / 4%), 0 8px 24px -16px rgb(0 0 0 / 18%)`,
              ],
            ]
          function tokensFor(mode, darkTheme = "kiko", contrast = 100, imported) {
            let p = imported?.palette ?? paletteFor(mode, darkTheme),
              accent = imported?.accent ?? THEMES[mode === "light" ? "snow" : darkTheme].accent,
              share = (n) => Math.min(100, round((n * contrast) / 100, 2)),
              ink = {
                p,
                accent,
                dark: mode === "dark",
                solid: (n) => `color-mix(in oklab, ${p.text} ${share(n)}%, ${p.canvas})`,
                clear: (n) => `color-mix(in oklab, ${p.text} ${share(n)}%, transparent)`,
              }
            return Object.fromEntries(ROLES.map(([token, value]) => [token, value(ink)]))
          }
          var TYPE = {
            page: { size: 40, line: 44, weight: 400, face: "display", scales: !1 },
            section: { size: 28, line: 34, weight: 400, face: "display", scales: !1 },
            wordmark: { size: 24, line: 28, weight: 400, face: "display", scales: !1 },
            msg: { size: 16, line: 26, weight: 400, face: "sans", scales: !0 },
            ui: { size: 15, line: 22, weight: 400, face: "sans", scales: !0 },
            row: { size: 15, line: 22, weight: 500, face: "sans", scales: !0 },
            label: { size: 13.5, line: 18, weight: 500, face: "sans", scales: !0 },
            hint: { size: 12.5, line: 16, weight: 400, face: "sans", scales: !0 },
            code: { size: 13.5, line: 22, weight: 400, face: "mono", scales: !0 },
          }
          var round2 = (n) => Math.round(n * 100) / 100
          function typeVars(base) {
            let vars = {}
            for (let [name, t] of Object.entries(TYPE)) {
              let size = t.scales ? round2(t.size + base - 14) : t.size
              ;((vars[`--type-${name}`] = `${size}px`), (vars[`--type-${name}-line`] = String(round2(t.line / t.size))))
            }
            return vars
          }
          var CONTRAST = { min: 80, max: 150, step: 5, default: 100 },
            BASE_SIZE = { min: 12, max: 16, default: 14 },
            NAME_MAX = 80,
            DEFAULT_DISPLAY = {
              contrast: 100,
              chatWidth: "comfortable",
              interfaceFont: "",
              codeFont: "",
              baseSize: BASE_SIZE.default,
              smoothing: !0,
            },
            CHAT_WIDTHS = {
              comfortable: { label: "Comfortable", width: "820px" },
              wide: { label: "Wide", width: "1152px" },
              full: { label: "Full", width: "100%" },
            },
            SANS_STACK = 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
            MONO_STACK = '"JetBrains Mono", "SF Mono", Menlo, Consolas, ui-monospace, monospace'
          function quoteFamily(name) {
            let bare = name.trim()
            if (bare.length === 0) return ""
            if (/^(['"]).*\1$/.test(bare)) return bare
            if (/^[a-zA-Z][a-zA-Z0-9-]*$/.test(bare)) return bare
            return `"${bare.replaceAll('"', "")}"`
          }
          function cssFontFamilies(input) {
            let families = input
              .split(",")
              .map(quoteFamily)
              .filter((name) => name.length > 0)
            return families.length > 0 ? families.join(", ") : null
          }
          var isObject = (v) => typeof v === "object" && v !== null && !Array.isArray(v),
            oneOf = (table, v, fallback) => (typeof v === "string" && v in table ? v : fallback),
            PRESET_KEYS = new Set(["kiko", "system", "rounded", "serif", "mono", "fantasque", "interface"]),
            familyName = (v) => {
              if (typeof v !== "string" || PRESET_KEYS.has(v)) return ""
              return v
                .replace(/["';\\{}<>]/g, "")
                .trim()
                .slice(0, NAME_MAX)
            }
          function readDisplay(value) {
            if (!isObject(value)) return DEFAULT_DISPLAY
            let c =
                typeof value.contrast === "number" && Number.isFinite(value.contrast)
                  ? value.contrast
                  : CONTRAST.default,
              size =
                typeof value.baseSize === "number" && Number.isFinite(value.baseSize)
                  ? Math.round(value.baseSize)
                  : BASE_SIZE.default
            return {
              contrast: Math.round(Math.min(CONTRAST.max, Math.max(CONTRAST.min, c)) / CONTRAST.step) * CONTRAST.step,
              chatWidth: oneOf(CHAT_WIDTHS, value.chatWidth, DEFAULT_DISPLAY.chatWidth),
              interfaceFont: familyName(value.interfaceFont),
              codeFont: familyName(value.codeFont),
              baseSize: Math.min(BASE_SIZE.max, Math.max(BASE_SIZE.min, size)),
              smoothing: typeof value.smoothing === "boolean" ? value.smoothing : DEFAULT_DISPLAY.smoothing,
            }
          }
          function fontVars(display) {
            let vars = {},
              sans = cssFontFamilies(display.interfaceFont),
              mono = cssFontFamilies(display.codeFont)
            if (sans !== null) vars["--font-family-sans"] = `${sans}, ${SANS_STACK}`
            if (mono !== null) vars["--font-family-mono"] = `${mono}, ${MONO_STACK}`
            return vars
          }
          function displayVars(display) {
            let b = display.baseSize
            return {
              ...fontVars(display),
              ...typeVars(b),
              "--chat-content-max-width": CHAT_WIDTHS[display.chatWidth].width,
              "--font-smoothing": display.smoothing ? "antialiased" : "auto",
            }
          }
          var SYNTAX_KEYS = ["keyword", "string", "func", "comment"]
          var MAX_IMPORTED = 50,
            HEX = /^#[0-9a-f]{6}$/i,
            ID = /^[\w:./-]{1,160}$/
          var APPEARANCES = ["light", "dark"],
            EMPTY_IMPORTED = { themes: [], active: {} }
          var isObject2 = (v) => typeof v === "object" && v !== null && !Array.isArray(v)
          function readTheme(raw) {
            if (!isObject2(raw) || !isObject2(raw.palette)) return null
            let { id, name, source, appearance, accent } = raw
            if (typeof id !== "string" || !ID.test(id)) return null
            if (typeof name !== "string" || name.length === 0 || name.length > 48) return null
            if (typeof source !== "string" || source.length > 160) return null
            if (!APPEARANCES.includes(appearance)) return null
            if (typeof accent !== "string" || !HEX.test(accent)) return null
            let palette = {}
            for (let key of PALETTE_KEYS) {
              let value = raw.palette[key]
              if (typeof value !== "string" || !HEX.test(value)) return null
              palette[key] = value
            }
            let theme = { id, name, source, appearance, accent, palette },
              syntax = readSyntax(raw.syntax)
            return syntax ? { ...theme, syntax } : theme
          }
          function readSyntax(raw) {
            if (!isObject2(raw)) return null
            let syntax = {}
            for (let key of SYNTAX_KEYS) {
              let value = raw[key]
              if (typeof value !== "string" || !HEX.test(value)) return null
              syntax[key] = value
            }
            return syntax
          }
          function parseImported(text) {
            if (!text) return EMPTY_IMPORTED
            let raw
            try {
              raw = JSON.parse(text)
            } catch {
              return EMPTY_IMPORTED
            }
            return readImported(raw)
          }
          function readImported(raw) {
            if (!isObject2(raw) || raw.v !== 1 || !Array.isArray(raw.themes)) return EMPTY_IMPORTED
            let themes = uniqueThemes(raw.themes),
              active = {}
            if (isObject2(raw.active))
              for (let appearance of APPEARANCES) {
                let id = raw.active[appearance]
                if (themes.some((theme) => theme.id === id && theme.appearance === appearance)) active[appearance] = id
              }
            return { themes, active }
          }
          function uniqueThemes(raw) {
            let seen = new Set(),
              themes = []
            for (let value of raw) {
              if (themes.length >= MAX_IMPORTED) break
              let theme = readTheme(value)
              if (!theme || seen.has(theme.id)) continue
              ;(seen.add(theme.id), themes.push(theme))
            }
            return themes
          }
          var themeFor = (state, appearance) => state.themes.find((theme) => theme.id === state.active[appearance])
          Object.assign(boot, {
            THEMES,
            DEFAULT_DARK_THEME,
            tokensFor,
            readDisplay,
            displayVars,
            parseImported,
            themeFor,
          })
        })()
        /* boot-palettes:end */
        var id = boot.DEFAULT_DARK_THEME,
          display = boot.readDisplay(null),
          imported = boot.parseImported(null)
        function stored(key) {
          try {
            return localStorage.getItem(key)
          } catch (e) {
            return null
          }
        }
        function json(text) {
          try {
            return JSON.parse(text)
          } catch (e) {
            return null
          }
        }
        if (stored("kiko:auth")) {
          var c = json(stored("kiko:look"))
          var look = c && (c.v === 5 || c.v === 6) && typeof c.text === "string" && json(c.text)
          if (look && !Array.isArray(look) && look.kind === "look") {
            if (["dark", "light", "system"].includes(look.mode)) mode = look.mode
            if (
              look.version === 5 &&
              typeof look.darkTheme === "string" &&
              look.darkTheme !== "snow" &&
              Object.hasOwn(boot.THEMES, look.darkTheme)
            )
              id = look.darkTheme
            display = boot.readDisplay(look.display)
          }
          imported = boot.parseImported(
            look && look.imported ? JSON.stringify(look.imported) : stored("kiko:imported-themes"),
          )
        }
        var light =
          mode === "light" ||
          (mode === "system" && typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches)
        var appearance = light ? "light" : "dark"
        var t = Object.assign(
          boot.tokensFor(appearance, id, display.contrast, boot.themeFor(imported, appearance)),
          boot.displayVars(display),
        )
        d.classList.toggle("dark", !light)
        d.style.colorScheme = light ? "light" : "dark"
        for (var k in t) d.style.setProperty(k, t[k])
        d.style.setProperty("--boot-bg", t["--bg"])
        d.style.setProperty("--boot-fg", t["--fg"])
        d.style.backgroundColor = t["--bg"]
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg, #161616);
        color: var(--boot-fg, #ededed);
      }
      body {
        font: var(--font-md, 14px) var(--font-family-sans, system-ui, sans-serif);
      }
      #root {
        height: 100%;
      }
      #boot {
        display: grid;
        place-items: center;
        height: 100%;
      }
      #boot img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        transform-origin: 50% 100%;
        animation: boot-hop 1.2s ease-in-out 400ms infinite;
      }
      @keyframes boot-hop {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
      #boot-error {
        display: none;
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        font: var(--type-ui, 14px) / var(--type-ui-line, 1.43) var(--font-family-sans, system-ui, sans-serif);
        color: var(--fg2, #a6a6a6);
      }
      #boot-error button {
        height: 32px;
        margin-left: 8px;
        padding: 0 12px;
        border: 0;
        border-radius: 9px;
        background: var(--raise, #262626);
        color: var(--fg, #ededed);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Kiko">
        <img src="/kiko-mascot.svg" width="56" height="56" alt="" />
      </div>
    </div>
    <div id="boot-error" role="alert">
      Could not load Kiko. <button type="button" onclick="location.reload()">Reload</button>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
