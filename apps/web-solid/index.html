<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#171717" />
    <title>Kiko</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var d = document.documentElement, mode = "dark", vars = null;
        try {
          var c = JSON.parse(localStorage.getItem("kiko:look"));
          if (c && c.v === 5) { mode = c.mode || "dark"; vars = c.vars; }
        } catch (e) {}
        var a = mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
        d.classList.toggle("dark", a === "dark");
        d.style.colorScheme = a;
        if (vars && vars[a]) for (var k in vars[a]) d.style.setProperty(k, vars[a][k]);
        var bg = a === "light" ? "#fcfcfc" : "#171717";
        d.style.setProperty("--boot-bg", bg);
        d.style.setProperty("--boot-fg", a === "light" ? "#27272a" : "#f5f5f5");
        d.style.backgroundColor = bg;
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #171717); color: var(--boot-fg, #ececec); }
      body { font: 14px var(--font-family-sans, system-ui, sans-serif); }
      #root { height: 100%; }
      #boot { display: flex; align-items: center; justify-content: center; height: 100%; }
      #boot svg { width: 64px; height: 64px; }
      #boot-error { display: none; position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="snap" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;visibility:hidden;pointer-events:none;background:var(--boot-bg,#171717)"></div>
    <script>
      (function () {
        var n = document.getElementById("snap");
        try {
          var s = JSON.parse(localStorage.getItem("kiko:snap") || "null");
          if (!s || s.v !== 1) return n.remove();
          // The installed app always opens at "/", and "/" is where the app resumes the last chat.
          // A chat's screen is the right thing to show there, so it is accepted from the resume paths.
          var here = location.pathname, there = s.path;
          var resume = (here === "/" || here === "/chat") && there.indexOf("/chat/") === 0;
          if (there !== here && !resume) return n.remove();
          var h = document.head, w = s.links.length;
          var show = function () {
            n.style.visibility = "visible";
            for (var i = 0; i < s.scroll.length; i++) {
              var e = n, p = s.scroll[i][0].split("/");
              for (var j = 0; j < p.length && e; j++) e = e.children[+p[j]];
              if (e) e.scrollTop = s.scroll[i][1];
            }
          };
          for (var i = 0; i < s.styles.length; i++) {
            var st = document.createElement("style");
            st.setAttribute("data-snap", "");
            st.textContent = s.styles[i];
            h.appendChild(st);
          }
          n.innerHTML = s.html;
          if (!w) return show();
          s.links.forEach(function (u) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = u;
            l.onload = function () { if (--w === 0) show(); };
            l.onerror = function () { n.remove(); };
            h.appendChild(l);
          });
        } catch (e) { n.remove(); }
      })();
    </script>
    <div id="root">
      <div id="boot">

        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#0a0a0a"/><g transform="translate(60 61) scale(1.04) translate(-60 -54)"><g transform="translate(0 7)"> <g transform="translate(48.5 50.5) rotate(-38)"> <path data-leaf="back" d="M0 0C13-6 13-24 0-33C-13-24-13-6 0 0Z" fill="#55685A" /> </g> <path d="M31 88C26 88 24 85 24.4 80C26.2 59 40.5 46 60 46C79.5 46 93.8 59 95.6 80C96 85 94 88 89 88Z" fill="#FBF6EC" /> <g transform="translate(68 48.5) rotate(22)"> <g data-leaf="front"> <path d="M0 0C14-7 14-27 0-37C-14-27-14-7 0 0Z" fill="#86A38D" /> <path d="M0-3Q1.6-18 0-32" stroke="#C3D5C6" stroke-width="1.5" fill="none" stroke-linecap="round" /> </g> </g> <ellipse cx="38.5" cy="76.5" rx="5" ry="2.7" fill="#F2A08E" opacity=".6" /> <ellipse cx="81" cy="74.5" rx="4.6" ry="2.5" fill="#F2A08E" opacity=".6" /> <g data-eyes=""> <circle cx="46.4" cy="67" r="3.4" fill="#C22F2A" /> <circle cx="70.6" cy="65.6" r="3.4" fill="#C22F2A" /> <circle cx="45.4" cy="65.9" r="1.15" fill="#FFF" opacity=".9" /> <circle cx="69.6" cy="64.5" r="1.15" fill="#FFF" opacity=".9" /> </g> </g></g></svg>

      </div>
    </div>
    <div id="boot-error">Something went wrong. Reload to try again.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
