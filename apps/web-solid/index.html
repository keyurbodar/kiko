    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg, #141414);
        color: var(--boot-fg, #f0f0f0);
      }
      body {
        font: 13px/18px system-ui, -apple-system, sans-serif;
      }
      #root {
        height: 100%;
      }
      #boot {
        display: grid;
        place-items: center;
        height: 100%;
      }
      #boot img {
        width: 56px;
        height: 56px;
        object-fit: contain;
        transform-origin: 50% 100%;
        animation: boot-hop 1.2s ease-in-out 400ms infinite;
      }
      @keyframes boot-hop {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
      #boot-error {
        display: none;
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        font: 13px/18px system-ui, -apple-system, sans-serif;
        color: var(--text-secondary, #f0f0f0bd);
      }
      #boot-error button {
        height: 24px;
        margin-left: 8px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: var(--bg-tertiary, #f0f0f014);
        color: var(--text-primary, #f0f0f0);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading Kiko">
        <img src="/kiko-mascot.svg" width="56" height="56" alt="" />
      </div>
    </div>
    <div id="boot-error" role="alert">
      Could not load Kiko. <button type="button" onclick="location.reload()">Reload</button>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
