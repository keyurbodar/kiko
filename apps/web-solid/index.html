<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Kiko</title>
    <link rel="icon" type="image/svg+xml" href="/kiko.svg" />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* the look before first paint: the appearance, then the palette's tokens for it.
         src/theme/apply.ts writes this cache under the same key. Without it, the dark
         default paints kat.css's charcoal palette, the same as DEFAULT_LOOK. */
      (function () {
        var d = document.documentElement, mode = "dark", vars = null;
        try {
          var c = JSON.parse(localStorage.getItem("kiko:look"));
          if (c && c.v === 4) { mode = c.mode || "dark"; vars = c.vars; }
        } catch (e) {}
        var a = mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
        d.classList.toggle("dark", a === "dark");
        d.style.colorScheme = a;
        if (vars && vars[a]) for (var k in vars[a]) d.style.setProperty(k, vars[a][k]);
        var bg = a === "light" ? "#fcfcfc" : "#0a0a0a";
        d.style.setProperty("--boot-bg", bg);
        d.style.setProperty("--boot-fg", a === "light" ? "#27272a" : "#f5f5f5");
        d.style.backgroundColor = bg;
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #0a0a0a); color: var(--boot-fg, #f5f5f5); }
      body { font: 14px system-ui, sans-serif; }
      #root { height: 100%; }
      #boot { display: flex; align-items: center; justify-content: center; height: 100%; }
      #boot svg { width: 64px; height: 64px; transform-origin: 50% 88%; animation: boot-hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
      @keyframes boot-hop { 0%, 100% { transform: translateY(0) scaleY(1); } 15% { transform: translateY(0) scaleY(.92); } 45% { transform: translateY(-12px) scaleY(1.04); } 75% { transform: translateY(0) scaleY(.96); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
      #boot-error { display: none; position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="snap" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;visibility:hidden;pointer-events:none;background:var(--boot-bg,#0a0a0a)"></div>
    <script>
      /* the last screen, painted before any module loads. src/lib/snapshot.ts saves it and removes this layer. */
      (function () {
        var n = document.getElementById("snap");
        try {
          var s = JSON.parse(localStorage.getItem("kiko:snap") || "null");
          if (!s || s.v !== 1 || s.path !== location.pathname) return n.remove();
          var h = document.head, w = s.links.length;
          var show = function () {
            n.style.visibility = "visible";
            for (var i = 0; i < s.scroll.length; i++) {
              var e = n, p = s.scroll[i][0].split("/");
              for (var j = 0; j < p.length && e; j++) e = e.children[+p[j]];
              if (e) e.scrollTop = s.scroll[i][1];
            }
          };
          for (var i = 0; i < s.styles.length; i++) {
            var st = document.createElement("style");
            st.setAttribute("data-snap", "");
            st.textContent = s.styles[i];
            h.appendChild(st);
          }
          n.innerHTML = s.html;
          if (!w) return show();
          s.links.forEach(function (u) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = u;
            l.onload = function () { if (--w === 0) show(); };
            l.onerror = function () { n.remove(); };
            h.appendChild(l);
          });
        } catch (e) { n.remove(); }
      })();
    </script>
    <div id="root">
      <div id="boot">
        <!-- boot-logo -->
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="2 21.5 103 103"><filter id="yb1r" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="6"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter><g class="bird-body" filter="url(#yb1r)" stroke="#2B2824" stroke-width="2.20" stroke-linejoin="round" stroke-linecap="round"><clipPath id="yb1c"><path d="M38 72 C38 55 51 45 67 45 C85 45 97 57 97 71 C97 86 85 96 67 96 C51 96 38 88 38 72Z"/></clipPath><path d="M44 75 C30 73 17 70.5 5 69 C3.4 68.8 3.3 72.4 5 72.9 C17 75.6 30 79 44 83Z" fill="#9C8C7E"/><path d="M61 95 L59.5 100.5 M64.5 95.6 L64 101 M72 95.6 L72.4 101 M75.5 95 L77 100.5" fill="none" stroke="#5E524A" stroke-width="2"/><path d="M38 72 C38 55 51 45 67 45 C85 45 97 57 97 71 C97 86 85 96 67 96 C51 96 38 88 38 72Z" fill="#F6EDE0" stroke="none"/><g clip-path="url(#yb1c)" stroke="none"><ellipse cx="74" cy="91" rx="21" ry="9" fill="#F2D8C6"/><path d="M40 77 C44 90 56 96 68 96 C56 92 46 86 43 73Z" fill="#000" fill-opacity=".12"/></g><path d="M38 72 C38 55 51 45 67 45 C85 45 97 57 97 71 C97 86 85 96 67 96 C51 96 38 88 38 72Z" fill="none"/><path d="M74 66 C66 61 54 63 47 70 C44 73 42 76 41 79 C47 80 54 79.5 60 77.5 C67 75 72 71 74 66Z" fill="#B6A28E" stroke-width="1.6"/><path d="M52 52 C55 49 59 47.5 63 47" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/><ellipse cx="84" cy="76" rx="4.6" ry="2.6679999999999997" fill="#F2A294" fill-opacity="0.75" stroke="none"/><g class="bird-eyes" stroke="none"><circle cx="85" cy="65.5" r="3.6" fill="#2B2420"/><circle cx="83.8" cy="64.2" r="1.296" fill="#fff"/></g><path d="M96.5 67.7 L102.5 70.5 L96.5 73.3Z" fill="#7A6458" stroke-width="1.4"/></g></svg>
        <!-- /boot-logo -->
      </div>
    </div>
    <div id="boot-error">Something went wrong. Reload to try again.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
