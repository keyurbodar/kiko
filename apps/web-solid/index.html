<!doctype html>
<html class="dark" lang="en" data-appearance="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#141414" />
    <title>kiko</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e8743b'/%3E%3Cpath d='M22 16v32M22 33l18-17M27 30l15 18' stroke='%231c1b1f' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <script>
      /* the look before first paint: the appearance, then the theme's variables for it.
         src/theme/apply.ts writes this cache under the same key. */
      (function () {
        var d = document.documentElement, mode = "system", vars = null;
        try {
          var c = JSON.parse(localStorage.getItem("kiko:look"));
          if (c && c.v === 2) { mode = c.mode; vars = c.vars; }
        } catch (e) {}
        var a = mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
        d.dataset.appearance = a;
        d.classList.toggle("dark", a === "dark");
        d.style.colorScheme = a;
        if (vars && vars[a]) for (var k in vars[a]) d.style.setProperty(k, vars[a][k]);
        var bg = a === "light" ? "#fafafa" : "#141414";
        d.style.setProperty("--boot-bg", bg);
        d.style.setProperty("--boot-fg", a === "light" ? "#222" : "#ddd");
        d.style.backgroundColor = bg;
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #141414); color: var(--boot-fg, #ddd); }
      body { font: 14px system-ui, sans-serif; }
      #root { height: 100%; }
      #boot { display: flex; align-items: center; justify-content: center; height: 100%; }
      #boot svg { width: 64px; height: 64px; }
      #boot-error { display: none; position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="snap" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;visibility:hidden;pointer-events:none;background:var(--boot-bg,#141414)"></div>
    <script>
      /* the last screen, painted before any module loads. src/lib/snapshot.ts saves it and removes this layer. */
      (function () {
        var n = document.getElementById("snap");
        try {
          var s = JSON.parse(localStorage.getItem("kiko:snap") || "null");
          if (!s || s.v !== 1 || s.path !== location.pathname) return n.remove();
          var h = document.head, w = s.links.length;
          var show = function () {
            n.style.visibility = "visible";
            for (var i = 0; i < s.scroll.length; i++) {
              var e = n, p = s.scroll[i][0].split("/");
              for (var j = 0; j < p.length && e; j++) e = e.children[+p[j]];
              if (e) e.scrollTop = s.scroll[i][1];
            }
          };
          for (var i = 0; i < s.styles.length; i++) {
            var st = document.createElement("style");
            st.setAttribute("data-snap", "");
            st.textContent = s.styles[i];
            h.appendChild(st);
          }
          n.innerHTML = s.html;
          if (!w) return show();
          s.links.forEach(function (u) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = u;
            l.onload = function () { if (--w === 0) show(); };
            l.onerror = function () { n.remove(); };
            h.appendChild(l);
          });
        } catch (e) { n.remove(); }
      })();
    </script>
    <div id="root">
      <div id="boot">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#e8743b" />
          <path d="M22 16v32M22 33l18-17M27 30l15 18" stroke="#141414" stroke-width="6" stroke-linecap="round" fill="none" />
        </svg>
      </div>
    </div>
    <div id="boot-error">something went wrong. reload to try again.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
