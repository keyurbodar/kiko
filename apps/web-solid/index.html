<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#18130e" />
    <title>Kiko</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var d = document.documentElement, mode = "dark", vars = null;
        try {
          var c = JSON.parse(localStorage.getItem("kiko:look"));
          if (c && c.v === 5) { mode = c.mode || "dark"; vars = c.vars; }
        } catch (e) {}
        var a = mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
        d.classList.toggle("dark", a === "dark");
        d.style.colorScheme = a;
        var t = (vars && vars[a]) || {};
        for (var k in t) d.style.setProperty(k, t[k]);
        var bg = t["--background"] || (a === "light" ? "#fff7f1" : "#18130e");
        d.style.setProperty("--boot-bg", bg);
        d.style.setProperty("--boot-fg", t["--foreground"] || (a === "light" ? "#271e17" : "#fdf2e8"));
        d.style.backgroundColor = bg;
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #18130e); color: var(--boot-fg, #fdf2e8); }
      body { font: 14px var(--font-family-sans, system-ui, sans-serif); }
      #root { height: 100%; }
      /* The saved screen (lib/snapshot.ts) is a picture of how the app looked: nothing in it enters again. */
      #snap * { animation: none !important; transition: none !important; }
      #boot { display: flex; align-items: center; justify-content: center; height: 100%; }
      #boot svg { width: 64px; height: 64px; }
      /* The boot screen cannot load motion.css. A load quicker than a beat never shows the tile; a longer one sees it fade in and breathe. */
      @media (prefers-reduced-motion: no-preference) {
        #boot svg { animation: boot-in 280ms 160ms ease-out both, boot-breathe 2.4s 440ms ease-in-out infinite; }
        @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
        @keyframes boot-breathe { 50% { transform: scale(1.04); } }
      }
      #boot-error { display: none; position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="snap" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;visibility:hidden;pointer-events:none;background:var(--boot-bg,#18130e)"></div>
    <script>
      (function () {
        var n = document.getElementById("snap");
        try {
          var s = JSON.parse(localStorage.getItem("kiko:snap") || "null");
          if (!s || s.v !== 1 || s.path !== location.pathname) return n.remove();
          var h = document.head, w = s.links.length;
          var show = function () {
            n.style.visibility = "visible";
            for (var i = 0; i < s.scroll.length; i++) {
              var e = n, p = s.scroll[i][0].split("/");
              for (var j = 0; j < p.length && e; j++) e = e.children[+p[j]];
              if (e) e.scrollTop = s.scroll[i][1];
            }
          };
          for (var i = 0; i < s.styles.length; i++) {
            var st = document.createElement("style");
            st.setAttribute("data-snap", "");
            st.textContent = s.styles[i];
            h.appendChild(st);
          }
          n.innerHTML = s.html;
          if (!w) return show();
          s.links.forEach(function (u) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = u;
            l.onload = function () { if (--w === 0) show(); };
            l.onerror = function () { n.remove(); };
            h.appendChild(l);
          });
        } catch (e) { n.remove(); }
      })();
    </script>
    <div id="root">
      <div id="boot">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2420"/><stop offset="1" stop-color="#161311"/></linearGradient><radialGradient id="tg" cx="60" cy="72" r="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E8A86A" stop-opacity="0.24"/><stop offset="1" stop-color="#E8A86A" stop-opacity="0"/></radialGradient><linearGradient id="ks" x1="0" y1="46" x2="0" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFCF6"/><stop offset=".6" stop-color="#FAF4EA"/><stop offset="1" stop-color="#EADFCE"/></linearGradient></defs><rect width="120" height="120" rx="26.4" fill="url(#tb)"/><rect width="120" height="120" rx="26.4" fill="url(#tg)"/><g transform="translate(60 63) scale(1.04) translate(-60 -57)"><g transform="translate(0 7)"><ellipse cx="60" cy="88.6" rx="32" ry="2.6" fill="#000" opacity="0.35"/><g transform="translate(48.5 50.5) rotate(-38)"><path d="M0 0C13-6 13-24 0-33C-13-24-13-6 0 0Z" fill="#55685A"/></g><path d="M31 88C26 88 24 85 24.4 80C26.2 59 40.5 46 60 46C79.5 46 93.8 59 95.6 80C96 85 94 88 89 88Z" fill="url(#ks)"/><g transform="translate(68 48.5) rotate(22)"><path d="M0 0C14-7 14-27 0-37C-14-27-14-7 0 0Z" fill="#86A38D"/><path d="M0-3Q1.6-18 0-32" stroke="#C3D5C6" stroke-width="1.5" fill="none" stroke-linecap="round"/></g><ellipse cx="38.5" cy="76.5" rx="5" ry="2.7" fill="#F2A08E" opacity=".6"/><ellipse cx="81" cy="74.5" rx="4.6" ry="2.5" fill="#F2A08E" opacity=".6"/><g fill="none" stroke="#C22F2A" stroke-width="2.9" stroke-linecap="round"><path d="M42 69.5Q46.4 62.6 50.8 69.5"/><path d="M66.4 67.5Q70.6 61.2 74.8 67.5"/></g></g></g></svg>

      </div>
    </div>
    <div id="boot-error">Something went wrong. Reload to try again.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
