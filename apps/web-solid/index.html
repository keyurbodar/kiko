<!doctype html>
<html class="dark" lang="en" data-appearance="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#171717" />
    <title>kiko</title>
    <link rel="icon" type="image/svg+xml" href="/kiko.svg" />
    <script>
      /* the look before first paint: the appearance, then the palette's tokens for it.
         src/theme/apply.ts writes this cache under the same key. Without it, kat.css already
         is the stock palette, monocode's. */
      (function () {
        var d = document.documentElement, mode = "dark", vars = null;
        try {
          var c = JSON.parse(localStorage.getItem("kiko:look"));
          if (c && c.v === 3) { mode = c.mode; vars = c.vars; }
        } catch (e) {}
        var a = mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : mode;
        d.dataset.appearance = a;
        d.classList.toggle("dark", a === "dark");
        d.style.colorScheme = a;
        if (vars && vars[a]) for (var k in vars[a]) d.style.setProperty(k, vars[a][k]);
        var bg = (vars && vars[a] && vars[a]["--bg"]) || (a === "light" ? "#f7f7f7" : "#171717");
        d.style.setProperty("--boot-bg", bg);
        d.style.setProperty("--boot-fg", a === "light" ? "#2e2e2e" : "#ebebeb");
        d.style.backgroundColor = bg;
        /* monocode's glass and the chat background's stand-in desktop. src/theme/glass.ts writes
           these keys and glassRoot() says what they set; a test runs both and compares. */
        var g = null, b = null;
        try { g = JSON.parse(localStorage.getItem("kiko:glass:v1")); } catch (e) {}
        try { b = JSON.parse(localStorage.getItem("kiko:background:v1")); } catch (e) {}
        g = g && typeof g === "object" ? g : {};
        var num = function (v, lo, hi, def) { return typeof v === "number" && isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def; };
        var ok = b && typeof b === "object" && typeof b.id === "string" && typeof b.desktop === "string" && /^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+\/]+={0,2}$/.test(b.desktop) && b.desktop.length <= 60000;
        var attr = function (n, on) { if (on === null) d.removeAttribute(n); else d.setAttribute(n, on); };
        attr("data-desktop", ok ? "" : null);
        attr("data-glass-body", g.body === false ? null : "");
        attr("data-chat-background", ok ? "" : null);
        attr("data-chat-background-scope", ok ? (b.scope === "empty" ? "empty" : "all") : null);
        attr("data-chat-background-effect", ok ? (["dither", "ascii", "halftone", "scanlines", "gradient-blur"].indexOf(b.effect) >= 0 ? b.effect : "none") : null);
        d.style.setProperty("--sidebar-opacity", String(Math.round(num(g.opacity, 0.15, 1, 0.85) * 100) / 100));
        d.style.setProperty("--glass-blur", Math.round(num(g.blur, 1, 64, 24)) + "px");
        d.style.setProperty("--chat-background-empty-opacity", String(ok ? Math.round(num(b.empty, 0.05, 0.65, 0.24) * 100) / 100 : 0.24));
        d.style.setProperty("--chat-background-session-opacity", String(ok ? Math.round(num(b.session, 0.05, 0.65, 0.24) * 100) / 100 : 0.24));
        d.style.setProperty("--desktop-image", ok ? 'url("' + b.desktop + '")' : "none");
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #171717); color: var(--boot-fg, #ebebeb); }
      body { font: 14px system-ui, sans-serif; }
      #root { height: 100%; }
      #boot { display: flex; align-items: center; justify-content: center; height: 100%; }
      #boot svg { width: 64px; height: 64px; transform-origin: 50% 88%; animation: boot-hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
      @keyframes boot-hop { 0%, 100% { transform: translateY(0) scaleY(1); } 15% { transform: translateY(0) scaleY(.92); } 45% { transform: translateY(-12px) scaleY(1.04); } 75% { transform: translateY(0) scaleY(.96); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
      #boot-error { display: none; position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="snap" style="position:fixed;inset:0;z-index:2147483000;overflow:hidden;visibility:hidden;pointer-events:none;background:var(--boot-bg,#171717)"></div>
    <script>
      /* the last screen, painted before any module loads. src/lib/snapshot.ts saves it and removes this layer. */
      (function () {
        var n = document.getElementById("snap");
        try {
          var s = JSON.parse(localStorage.getItem("kiko:snap") || "null");
          if (!s || s.v !== 1 || s.path !== location.pathname) return n.remove();
          var h = document.head, w = s.links.length;
          var show = function () {
            n.style.visibility = "visible";
            for (var i = 0; i < s.scroll.length; i++) {
              var e = n, p = s.scroll[i][0].split("/");
              for (var j = 0; j < p.length && e; j++) e = e.children[+p[j]];
              if (e) e.scrollTop = s.scroll[i][1];
            }
          };
          for (var i = 0; i < s.styles.length; i++) {
            var st = document.createElement("style");
            st.setAttribute("data-snap", "");
            st.textContent = s.styles[i];
            h.appendChild(st);
          }
          n.innerHTML = s.html;
          if (!w) return show();
          s.links.forEach(function (u) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = u;
            l.onload = function () { if (--w === 0) show(); };
            l.onerror = function () { n.remove(); };
            h.appendChild(l);
          });
        } catch (e) { n.remove(); }
      })();
    </script>
    <div id="root">
      <div id="boot">
        <!-- boot-logo -->
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="2 1.5 104 104"><defs><clipPath id="bird-0"><ellipse cx="48" cy="57" rx="32" ry="30"/></clipPath></defs><g class="bird-feet"><ellipse cx="40" cy="87.5" rx="5" ry="3" fill="#FFA14A"/><ellipse cx="54" cy="87.5" rx="5" ry="3" fill="#FFA14A"/></g><g class="bird-body"><ellipse cx="45" cy="25" rx="3.6" ry="7.5" transform="rotate(-24 47 31)" style="fill:oklch(0.8 calc(0.095 * 1) calc(340 + 0))"/><ellipse cx="50" cy="24" rx="3.6" ry="7.5" transform="rotate(14 50 31)" style="fill:oklch(0.8 calc(0.095 * 1) calc(340 + 0))"/><ellipse cx="48" cy="57" rx="32" ry="30" style="fill:oklch(0.8 calc(0.095 * 1) calc(340 + 0))"/><g clip-path="url(#bird-0)"><ellipse cx="62" cy="76" rx="20" ry="15" fill="#FFE3D2"/><path class="bird-wing" d="M22 60 Q31 48 46 57 Q37 71 22 60Z" style="fill:oklch(0.72 calc(0.095 * 1) calc(340 + 0))"/><ellipse cx="34" cy="40" rx="6" ry="3.6" transform="rotate(-30 34 40)" fill="#fff" opacity=".32"/></g><path d="M77 47 Q90 50.5 90 53 Q90 55.5 77 59Z" fill="#FFA14A" stroke="#FFA14A" stroke-width="3" stroke-linejoin="round"/><ellipse class="bird-eye" cx="63" cy="52" rx="4.4" ry="5.4" fill="#221A20"/><circle cx="64.5" cy="50" r="1.7" fill="#fff"/><circle cx="61.8" cy="54.2" r=".8" fill="#fff"/><ellipse cx="64" cy="63" rx="5" ry="2.8" fill="#FF7C99" opacity=".45"/></g></svg>
        <!-- /boot-logo -->
      </div>
    </div>
    <div id="boot-error">something went wrong. reload to try again.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
