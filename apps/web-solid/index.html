<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1b1f" />
    <title>kiko</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e8743b'/%3E%3Cpath d='M22 16v32M22 33l18-17M27 30l15 18' stroke='%231c1b1f' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <script>
      /* theme variables before first paint. dark ships first. */
      (function () {
        var d = document.documentElement;
        /* the saved theme, cached by src/theme/apply.ts under the same key */
        try {
          var c = JSON.parse(localStorage.getItem("kiko:theme"));
          var t = c && c.v === 1 && c.theme;
          if (t) {
            var r = t.light && matchMedia("(prefers-color-scheme: light)").matches ? t.light : t.base;
            for (var k in r.vars) d.style.setProperty(k, r.vars[k]);
            d.classList.toggle("dark", r.appearance === "dark");
            d.style.colorScheme = r.appearance;
            var b = r.vars["--bg"];
            if (b) {
              d.style.setProperty("--boot-bg", b);
              d.style.backgroundColor = b;
              return;
            }
          }
        } catch (e) {}
        d.style.setProperty("--boot-bg", "#1c1b1f");
        d.style.setProperty("--boot-fg", "#ddd");
        d.style.backgroundColor = "#1c1b1f";
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: var(--boot-bg, #1c1b1f); color: var(--boot-fg, #ddd); }
      body { font: 14px system-ui, sans-serif; }
      #root { height: 100%; }
      #boot { display: flex; align-items: center; justify-content: center; height: 100%; }
      #boot svg { width: 64px; height: 64px; }
      #boot-error { display: none; position: fixed; bottom: 24px; left: 0; right: 0; text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#e8743b" />
          <path d="M22 16v32M22 33l18-17M27 30l15 18" stroke="#1c1b1f" stroke-width="6" stroke-linecap="round" fill="none" />
        </svg>
      </div>
    </div>
    <div id="boot-error">something went wrong. reload to try again.</div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
