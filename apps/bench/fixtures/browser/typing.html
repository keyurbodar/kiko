<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kiko-bench-typing</title>
  </head>
  <body>
    <h1>kiko bench typing fixture</h1>
    <label for="field">Field</label>
    <input id="field" autocomplete="off" />
    <div id="out"></div>
    <script>
      const field = document.querySelector("#field")
      const out = document.querySelector("#out")
      field.addEventListener("input", () => {
        out.textContent = field.value
      })
    </script>
  </body>
</html>
