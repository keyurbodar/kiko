<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiko: richer L1 on Aurora</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif);color:var(--foreground,#eee)}
p.n{font-size:13px;line-height:1.55;color:var(--muted-foreground,#a3a3a3);margin:0 0 14px}
p.n b{color:var(--foreground,#eee)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.oc{background:#141416;border-radius:16px;padding:10px 10px 14px;color:#f5f5f5}
.oc h3{margin:10px 4px 2px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.oc p{margin:0 4px;font-size:12px;line-height:1.45;color:#9a9aa3}
.id{font:600 10.5px ui-monospace,monospace;color:#8fa9ff;background:rgb(52 107 241 / 18%);padding:1px 6px;border-radius:5px}
.pick{font:600 10.5px system-ui;color:#0a0a0a;background:#f5f5f5;padding:1px 7px;border-radius:999px}
svg{display:block}
.f{position:relative;height:170px;border-radius:10px;overflow:hidden;background:linear-gradient(#06070d,#0a0a0a 70%);isolation:isolate}
.f .aur{position:absolute;inset:-10% -15% 30%;mask-image:linear-gradient(#000 25%,transparent 95%);-webkit-mask-image:linear-gradient(#000 25%,transparent 95%);pointer-events:none}
.f .aur i{position:absolute;border-radius:50%;filter:blur(26px);mix-blend-mode:screen;opacity:.75}
.f .aur i:nth-child(1){left:0;top:10%;width:60%;height:38%;background:oklch(0.62 0.17 262);animation:a1 17s ease-in-out infinite alternate}
.f .aur i:nth-child(2){left:36%;top:22%;width:55%;height:28%;background:oklch(0.6 0.17 295);animation:a2 21s ease-in-out infinite alternate}
.f .aur i:nth-child(3){left:20%;top:38%;width:46%;height:20%;background:oklch(0.72 0.12 200);opacity:.45;animation:a3 15s ease-in-out infinite alternate}
.f .aur b{position:absolute;inset:0;background:repeating-linear-gradient(98deg,rgb(255 255 255 / .05) 0 1px,transparent 1px 7px);mask-image:linear-gradient(transparent,#000 25%,transparent 65%);-webkit-mask-image:linear-gradient(transparent,#000 25%,transparent 65%)}
.f .star{position:absolute;inset:0;background-image:radial-gradient(circle at 12px 18px,#fff 0 .6px,transparent 1px),radial-gradient(circle at 70px 40px,#fffa 0 .5px,transparent .9px),radial-gradient(circle at 130px 12px,#fffc 0 .7px,transparent 1.1px),radial-gradient(circle at 150px 90px,#fff9 0 .6px,transparent 1px);background-size:170px 110px}
.f .hero{position:absolute;left:50%;top:50%;width:132px;transform:translate(-50%,-46%)}
@keyframes a1{to{transform:translate(12%,6%) scale(1.15,.8) rotate(-4deg)}}
@keyframes a2{to{transform:translate(-14%,-4%) scale(.9,1.2) rotate(5deg)}}
@keyframes a3{to{transform:translate(10%,-8%) scale(1.25,.85)}}
.sizes{display:flex;align-items:flex-end;gap:10px;margin:10px 4px 0}
.sizes .lt{display:flex;align-items:flex-end;gap:8px;background:#f5f5f5;border-radius:8px;padding:6px;margin-left:auto}
@media (prefers-reduced-motion:no-preference){
  .yk .all{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
  .yk .lf{transform-box:fill-box;transform-origin:50% 100%;animation:leaf 5s ease-in-out infinite}
  .yk .lf.r{animation-delay:.3s}
  .yk .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite 1.5s}
}
@media (prefers-reduced-motion:reduce){.f .aur i{animation:none}}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes leaf{50%{transform:rotate(6deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
</style></head><body>

<p class="n">L1 is the base. Each version below adds richness with <b>flat colour only</b>: shade tones, two-tone leaves, highlights and small details, with no glow or gradient. Each is shown on your B4 aurora, then as the app icon at 64, 32 and 16 on black and on white.</p>
<div class="grid" id="g"></div>

<script>
const BODY = "M28 88Q20 88 20 80C20 58 38 44 60 44C82 44 100 58 100 80Q100 88 92 88Z"
const LEAF = "M0 0C10-6 10-22 0-32C-10-22-10-6 0 0Z"
const HALF = "M0 0C10-6 10-22 0-32Z"
let uid = 0
function yuki(o) {
  const k = "c" + uid++
  const P = Object.assign({ body: "#F7F7F4", back: "#5f7a66", front: "#86a38d", eye: "#C22F2A", blush: "#F2A08E", blushO: 0.75 }, o)
  const leaf = (x, y, r, fill, dark, cls) => `<g transform="translate(${x} ${y}) rotate(${r})"><g class="${cls}"><path d="${LEAF}" fill="${fill}"/>${P.twoTone ? `<path d="${HALF}" fill="${dark}"/>` : ""}${P.vein ? `<path d="M0-3Q1.6-16 0-29" stroke="${P.vein}" stroke-width="1.6" fill="none" stroke-linecap="round"/>` : ""}</g></g>`
  const inside = []
  if (P.shade) inside.push(`<ellipse cx="68" cy="99" rx="50" ry="20" fill="${P.shade}"/>`)
  if (P.speck) inside.push([[38, 60, 1], [70, 54, 0.9], [84, 70, 1.1], [32, 74, 0.8], [58, 82, 0.9], [90, 80, 0.7], [50, 55, 0.7]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${P.speck}"/>`).join(""))
  if (P.scarf) inside.push(`<path d="M18 74Q60 88 102 74L102 82Q60 96 18 82Z" fill="${P.scarf}"/><path d="M18 78Q60 92 102 78" stroke="${P.scarf2}" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/>`)
  if (P.rim) inside.push(`<path d="M23 74C25 56 40 47 60 47C80 47 95 56 97 74" stroke="${P.rim}" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(0 -1.4)"/>`)
  if (P.hi) inside.push(`<ellipse cx="38" cy="57" rx="7" ry="3.2" fill="#fff" transform="rotate(-28 38 57)"/>`)
  const eyes = `<g class="eyes">${[48, 72].map((x) => `<circle cx="${x}" cy="68" r="${P.eyeR || 3.6}" fill="${P.eye}"/>${P.ring ? `<circle cx="${x}" cy="68.6" r="${(P.eyeR || 3.6) - 1.1}" fill="${P.ring}"/>` : ""}${P.spark ? `<circle cx="${x - 1.2}" cy="66.6" r="1.25" fill="#fff"/>` : ""}`).join("")}</g>`
  const mouth = P.mouth ? `<path d="M56.6 74.2q1.7 1.8 3.4 0q1.7 1.8 3.4 0" stroke="#9b4b42" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : ""
  const feet = P.feet ? `<ellipse cx="42" cy="88.5" rx="7" ry="3.4" fill="${P.shade || "#e3e8ef"}"/><ellipse cx="78" cy="88.5" rx="7" ry="3.4" fill="${P.shade || "#e3e8ef"}"/>` : ""
  const tail = P.scarf ? `<path d="M80 84L86 100L92 98L88 83Z" fill="${P.scarf}"/>` : ""
  return `<defs><clipPath id="${k}"><path d="${BODY}"/></clipPath></defs><g class="all">${leaf(50, 47, -20, P.back, P.backDark, "lf")}${leaf(70, 47, 20, P.front, P.frontDark, "lf r")}${feet}<path d="${BODY}" fill="${P.body}"/><g clip-path="url(#${k})">${inside.join("")}</g>${tail}${eyes}<ellipse cx="41" cy="76" rx="4.8" ry="2.5" fill="${P.blush}" opacity="${P.blushO}"/><ellipse cx="79" cy="76" rx="4.8" ry="2.5" fill="${P.blush}" opacity="${P.blushO}"/>${mouth}</g>`
}
const bare = (o) => `<svg class="yk" viewBox="16 10 88 92">${yuki(o)}</svg>`
const icon = (o, bg = "#0a0a0a") => `<svg viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="${bg}"/><g transform="translate(60 61) scale(1.08) translate(-60 -56)">${yuki(o)}</g></svg>`

const LEAVES2 = { twoTone: true, backDark: "#4c6553", frontDark: "#6f8c77" }
const V = [
  ["R1", "Cel shade", "A cool shade tone across the lower body and a small white highlight. It reads as round instead of flat.", { body: "#FAFAF7", shade: "#DDE4EE", hi: true, vein: "#b9cfbf" }],
  ["R2", "Sparkle eyes", "Two-tone eyes with a white catchlight, two-tone leaves and stronger blush. The face comes alive.", { ...LEAVES2, ring: "#E0453B", spark: true, blushO: 0.9 }],
  ["R3", "Snow mochi", "Pale blue speckles like fresh snow, plus the shade tone. A nod to main's mochi.", { body: "#FAFAF7", shade: "#DDE4EE", speck: "#BCCBE0" }],
  ["R4", "Aurora tint", "The shade picks up lavender from the sky and the leaves turn teal-green to match B4.", { body: "#FAFAFC", shade: "#DCDCF6", back: "#3f7f78", front: "#6fb6a8", ...{ twoTone: true, backDark: "#336b65", frontDark: "#5a9e91" }, spark: true, blush: "#F59AB0" }],
  ["R5", "Rim light", "A thin azure edge along the top, as if the aurora is lighting Yuki from above. Flat colour, not a glow.", { body: "#FAFAF7", shade: "#DDE4EE", rim: "#8fb0ff", spark: true }],
  ["R6", "Scarf", "An azure scarf in Kiko's accent, with a little tail. Adds colour without touching the face.", { ...LEAVES2, scarf: "#346bf1", scarf2: "#8eaeff", spark: true }],
  ["R7", "Tiny smile", "A small cat-like mouth, sparkle eyes and two little feet. The most character.", { mouth: true, spark: true, feet: true, shade: "#E3E8EF" }],
  ["R8", "Full", "Shade, highlight, speckles, two-tone leaves with veins, sparkle eyes and a smile. Rich up close; the icon drops the speckles and smile at small sizes.", { body: "#FAFAF7", shade: "#DDE4EE", hi: true, speck: "#C6D3E6", ...LEAVES2, vein: "#c3d5c6", ring: "#E0453B", spark: true, mouth: true, blushO: 0.85 }, true],
  ["R9", "Full with scarf", "R8 with the azure scarf. The most colourful, and the scarf ties Yuki to Kiko's accent.", { body: "#FAFAF7", shade: "#DDE4EE", hi: true, ...LEAVES2, vein: "#c3d5c6", ring: "#E0453B", spark: true, scarf: "#346bf1", scarf2: "#8eaeff", blushO: 0.85 }],
]
const small = (o) => { const s = { ...o }; delete s.speck; delete s.mouth; delete s.vein; delete s.hi; delete s.feet; s.eyeR = 4.4; s.ring = undefined; s.spark = false; return s }
const g = document.getElementById("g")
for (const [id, name, line, o, pick] of V) {
  const c = document.createElement("div"); c.className = "oc"
  c.innerHTML = `<div class="f"><div class="star"></div><div class="aur"><i></i><i></i><i></i><b></b></div><div class="hero">${bare(o)}</div></div>
    <div class="sizes"><div style="width:56px">${icon(o)}</div><div style="width:32px">${icon(small(o))}</div><div style="width:16px">${icon(small(o))}</div><div class="lt"><div style="width:32px">${icon(small(o))}</div><div style="width:16px">${icon(small(o))}</div></div></div>
    <h3><span class="id">${id}</span>${name}${pick ? ' <span class="pick">Pick</span>' : ""}</h3><p>${line}</p>`
  g.append(c)
}
</script>
</body></html>
