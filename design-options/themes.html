<!doctype html>
<html lang="en" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuki theme options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
<style>
/*
  every theme is one table of tokens. surfaces are flat and solid. the accent (a yuki swatch,
  --hue and --cm) is only spent on four things: your bubble, the send button, the unread dot,
  and the mention badge. counts, selection and chrome stay neutral, which is what makes them
  sit together.
*/
:root { --hue: 245; --cm: 1; --tint: 1; --h-brand: var(--hue); }

/* ---------- graphite: claude's dark. neutral greys, solid selection, quiet badges ---------- */
[data-theme="graphite"] {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --side: oklch(.175 0 0); --main: oklch(.205 0 0); --divider: oklch(1 0 0 / .06);
  --hover: oklch(.225 0 0); --sel: oklch(.27 0 0); --sel-edge: transparent; --sel-shadow: none;
  --text: oklch(.93 0 0); --text-2: oklch(.7 0 0); --text-3: oklch(.56 0 0);
  --field: oklch(.215 0 0); --field-edge: oklch(1 0 0 / .08);
  --count: oklch(.33 0 0); --count-text: oklch(.88 0 0); --count-on-sel: oklch(.38 0 0);
  --muted-count: oklch(.26 0 0); --muted-count-text: oklch(.6 0 0);
  --dot: oklch(.76 calc(.12*var(--cm)) var(--hue));
  --mention: oklch(.76 calc(.12*var(--cm)) var(--hue)); --mention-text: oklch(.2 .02 var(--hue));
  --tile: oklch(.22 0 0);
  --asst: oklch(.255 0 0); --asst-text: var(--text);
  --user: oklch(.4 calc(.07*var(--cm)) var(--hue)); --user-text: oklch(.97 .01 var(--hue));
  --composer: oklch(.235 0 0); --composer-edge: oklch(1 0 0 / .09);
  --send: oklch(.93 0 0); --send-text: oklch(.18 0 0);
  --pill: oklch(.24 0 0);
  --r-row: 8px; --r-tile: 12px; --r-bubble: 18px; --r-composer: 18px; --r-badge: 9px;
  --row: 50px;
}
/* ---------- ink: cool near-black, selection is a raised card with an edge ---------- */
[data-theme="ink"] {
  color-scheme: dark;
  --font: "Inter", system-ui, sans-serif;
  --side: oklch(.165 .008 265); --main: oklch(.185 .008 265); --divider: oklch(1 0 0 / .07);
  --hover: oklch(.21 .01 265); --sel: oklch(.235 .012 265); --sel-edge: oklch(1 0 0 / .09); --sel-shadow: 0 1px 2px oklch(0 0 0 / .35);
  --text: oklch(.94 .004 265); --text-2: oklch(.72 .01 265); --text-3: oklch(.56 .012 265);
  --field: oklch(.2 .01 265); --field-edge: oklch(1 0 0 / .08);
  --count: oklch(.72 calc(.13*var(--cm)) var(--hue)); --count-text: oklch(.17 .02 var(--hue)); --count-on-sel: var(--count);
  --muted-count: oklch(.3 .01 265); --muted-count-text: oklch(.7 .01 265);
  --dot: oklch(.75 calc(.13*var(--cm)) var(--hue));
  --mention: oklch(.75 calc(.13*var(--cm)) var(--hue)); --mention-text: oklch(.17 .02 var(--hue));
  --tile: oklch(.21 .01 265);
  --asst: oklch(.24 .01 265); --asst-text: var(--text);
  --user: oklch(.58 calc(.13*var(--cm)) var(--hue)); --user-text: oklch(.99 .005 var(--hue));
  --composer: oklch(.21 .01 265); --composer-edge: oklch(1 0 0 / .1);
  --send: oklch(.72 calc(.13*var(--cm)) var(--hue)); --send-text: oklch(.17 .02 var(--hue));
  --pill: oklch(.22 .01 265);
  --r-row: 7px; --r-tile: 10px; --r-bubble: 16px; --r-composer: 14px; --r-badge: 6px;
  --row: 48px;
}
/* ---------- porcelain: claude's light. warm paper, grey selection, ink badges ---------- */
[data-theme="porcelain"] {
  color-scheme: light;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --side: oklch(.965 .004 85); --main: oklch(.988 .003 85); --divider: oklch(0 0 0 / .07);
  --hover: oklch(.935 .005 85); --sel: oklch(.905 .006 85); --sel-edge: transparent; --sel-shadow: none;
  --text: oklch(.22 .005 85); --text-2: oklch(.45 .008 85); --text-3: oklch(.58 .008 85);
  --field: oklch(.99 .002 85); --field-edge: oklch(0 0 0 / .09);
  --count: oklch(.3 .005 85); --count-text: oklch(.98 .003 85); --count-on-sel: oklch(.3 .005 85);
  --muted-count: oklch(.87 .006 85); --muted-count-text: oklch(.45 .008 85);
  --dot: oklch(.58 calc(.15*var(--cm)) var(--hue));
  --mention: oklch(.58 calc(.15*var(--cm)) var(--hue)); --mention-text: oklch(.99 .003 var(--hue));
  --tile: oklch(.935 .005 85);
  --asst: oklch(.945 .005 85); --asst-text: var(--text);
  --user: oklch(.56 calc(.12*var(--cm)) var(--hue)); --user-text: oklch(.99 .003 var(--hue));
  --composer: oklch(.995 .002 85); --composer-edge: oklch(0 0 0 / .1);
  --send: oklch(.24 .005 85); --send-text: oklch(.98 .003 85);
  --pill: oklch(.94 .005 85);
  --r-row: 9px; --r-tile: 12px; --r-bubble: 18px; --r-composer: 20px; --r-badge: 9px;
  --row: 50px;
}
/* ---------- frost: monocode's glass, but neutral. a still scene, no colour wash ---------- */
[data-theme="frost"] {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --side: oklch(.2 calc(.009*var(--cm)*var(--tint)) var(--hue) / .5); --main: oklch(.2 calc(.009*var(--cm)*var(--tint)) var(--hue) / .62); --divider: oklch(1 0 0 / .08);
  --hover: oklch(1 0 0 / .05); --sel: oklch(1 0 0 / .1); --sel-edge: oklch(1 0 0 / .08); --sel-shadow: none;
  --text: oklch(.95 calc(.003*var(--cm)) var(--hue)); --text-2: oklch(.76 calc(.008*var(--cm)*var(--tint)) var(--hue)); --text-3: oklch(.62 calc(.01*var(--cm)*var(--tint)) var(--hue));
  --field: oklch(0 0 0 / .2); --field-edge: oklch(1 0 0 / .09);
  --count: oklch(1 0 0 / .16); --count-text: oklch(.95 0 0); --count-on-sel: oklch(1 0 0 / .2);
  --muted-count: oklch(1 0 0 / .08); --muted-count-text: oklch(.7 0 0);
  --dot: oklch(.78 calc(.12*var(--cm)) var(--hue));
  --mention: oklch(.78 calc(.12*var(--cm)) var(--hue)); --mention-text: oklch(.2 .02 var(--hue));
  --tile: oklch(1 0 0 / .06);
  --asst: oklch(1 0 0 / .09); --asst-text: var(--text);
  --user: oklch(.5 calc(.09*var(--cm)) var(--hue) / .85); --user-text: oklch(.98 .005 var(--hue));
  --composer: oklch(0 0 0 / .22); --composer-edge: oklch(1 0 0 / .1);
  --send: oklch(.95 0 0); --send-text: oklch(.18 0 0);
  --pill: oklch(1 0 0 / .08);
  --r-row: 10px; --r-tile: 12px; --r-bubble: 18px; --r-composer: 16px; --r-badge: 9px;
  --row: 52px;
}
/* mono has no hue: the accent becomes the text colour */
[data-mono="1"] { --dot: var(--text); --mention: var(--text); --mention-text: var(--main); --user: var(--text); --user-text: var(--side); }
[data-mono="1"][data-theme="frost"] { --mention-text: oklch(.2 0 0); --user-text: oklch(.2 0 0); }
[data-theme="ink"][data-mono="1"] { --count: var(--text); --count-text: oklch(.17 0 0); --count-on-sel: var(--text); --send: var(--text); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; font: 13.5px/1.35 var(--font); color: var(--text); background: var(--side); overflow: hidden; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; cursor: default; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* the frost scene: a dim, desaturated stand-in for a wallpaper */
.scene { display: none; position: fixed; inset: 0; z-index: 0; background: oklch(.24 calc(.01*var(--cm)*var(--tint)) var(--hue)); overflow: hidden; }
[data-theme="frost"] .scene { display: block; }
.scene i { position: absolute; border-radius: 50%; filter: blur(30px); }
.scene::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, oklch(0 0 0 / .14) 0 1px, transparent 1px 3px); }
[data-theme="frost"] body, [data-theme="frost"] { background: oklch(.24 calc(.01*var(--cm)*var(--tint)) var(--hue)); }

/* ---------- design controls, not part of the app ---------- */
.ctl { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: #0b0b0b; color: #ddd; font: 12px/1 "Inter", sans-serif; border-bottom: 1px solid #ffffff14; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: #ffffff10; }
.seg button { padding: 6px 10px; border-radius: 6px; color: #aaa; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #ffffff22; color: #fff; }
.sw { display: flex; gap: 5px; flex-wrap: wrap; }
.sw button { width: 16px; height: 16px; border-radius: 50%; }
.sw button[aria-pressed="true"] { outline: 2px solid #fff; outline-offset: 2px; }
.ctl .note { color: #888; flex: 1; min-width: 200px; line-height: 1.35; }

/* ---------- shell ---------- */
.shell { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; }
[data-theme="frost"] .shell { margin: 18px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px oklch(1 0 0 / .1), 0 30px 80px oklch(0 0 0 / .5); }
.side { width: 288px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--divider); }
[data-theme="frost"] .side, [data-theme="frost"] .main { backdrop-filter: blur(28px) saturate(1.2); -webkit-backdrop-filter: blur(28px) saturate(1.2); }
.side[hidden] { display: none; }

.top { height: 50px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 16px; flex: none; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; letter-spacing: -0.015em; }
.logo .bird { width: 22px; height: 22px; }
.sp { flex: 1; }
.ib { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--text-3); }
.ib:hover { background: var(--hover); color: var(--text); }
.ib[aria-pressed="true"] { color: var(--text); background: var(--sel); }
.ib[hidden] { display: none; }

.search { margin: 2px 10px 6px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--r-row); background: var(--field); box-shadow: inset 0 0 0 1px var(--field-edge); color: var(--text-3); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search kbd { font: 11px var(--font); color: var(--text-3); }
.nav { padding: 0 10px 4px; display: flex; flex-direction: column; gap: 1px; }
.nav-row { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r-row); color: var(--text-2); width: 100%; text-align: left; }
.nav-row:hover { background: var(--hover); color: var(--text); }
.nav-row kbd { margin-left: auto; font: 11px var(--font); color: var(--text-3); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px; scrollbar-width: thin; scrollbar-color: var(--sel) transparent; }

/* pinned */
.pins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 0 4px; }
.pin { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 7px; border-radius: var(--r-tile); min-width: 0; }
.pin:hover { background: var(--hover); }
.pin[aria-current="true"] { background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge), var(--sel-shadow); }
.pin .circle { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); }
.pin[aria-current="true"] .circle { background: transparent; }
.pin .circle > .face { width: 32px; height: 32px; }
.pin .dot { position: absolute; right: 0; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 2.5px var(--side); }
.pin[aria-current="true"] .dot { box-shadow: 0 0 0 2.5px var(--sel); }
[data-theme="frost"] .pin .dot { box-shadow: none; }
.pin .n { font-size: 11.5px; color: var(--text-2); max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin[data-unread] .n, .pin[aria-current="true"] .n { color: var(--text); }

.label { display: flex; align-items: center; height: 32px; padding: 10px 4px 0 10px; color: var(--text-3); font-size: 12px; }
.label .ib { width: 24px; height: 24px; }
.label .ib svg { width: 14px; height: 14px; }

/* rows */
.row { position: relative; display: flex; align-items: center; gap: 11px; height: var(--row); padding: 0 10px; border-radius: var(--r-row); width: 100%; text-align: left; }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge), var(--sel-shadow); }
.row > .face { width: 30px; height: 30px; }
.row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row .time { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.row[data-unread] .time { color: var(--text-2); }
.row .l2 { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row[data-unread] .l2 { color: var(--text-2); }
.row .from { color: var(--text-2); }
.row .draft { color: oklch(.68 .14 25); }
[data-theme="porcelain"] .row .draft { color: oklch(.55 .17 25); }
.row .typing { color: var(--text-2); }
.row .typing i { display: inline-block; width: 3px; height: 3px; margin-left: 2px; border-radius: 50%; background: currentColor; vertical-align: middle; animation: blink 1.2s infinite; }
.row .typing i:nth-child(2) { animation-delay: .2s; } .row .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .25; } }
/* the badges: same height, same radius family, one accent only when it is about you */
.count, .at { height: 18px; min-width: 18px; padding: 0 6px; border-radius: var(--r-badge); display: grid; place-items: center; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; font-style: normal; }
.count { background: var(--count); color: var(--count-text); }
.row[aria-current="true"] .count { background: var(--count-on-sel); }
.row[data-muted] .count { background: var(--muted-count); color: var(--muted-count-text); }
.at { padding: 0; background: var(--mention); color: var(--mention-text); }
.mute { width: 12px !important; height: 12px !important; color: var(--text-3); }

.stack { position: relative; flex: none; }
.stack > span { position: absolute; display: flex; }
.face svg { width: 100%; height: 100%; display: block; overflow: visible; }

.foot { display: flex; align-items: center; gap: 10px; padding: 10px 10px 12px 16px; flex: none; border-top: 1px solid var(--divider); }
.foot .me { width: 28px; height: 28px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--text-2); }
.foot .who { flex: 1; display: flex; flex-direction: column; font-weight: 500; }
.foot .who small { color: var(--text-3); font-size: 11.5px; font-weight: 400; }

/* ---------- the chat thread ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--main); }
.bar { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 16px; flex: none; border-bottom: 1px solid var(--divider); }
.bar .stack { width: 26px; height: 26px; }
.bar b { font-weight: 600; }
.bar small { color: var(--text-3); font-size: 12.5px; }
.thread { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 24px 16px; }
.col { max-width: 740px; margin: 0 auto; }
.day { display: flex; justify-content: center; margin: 14px 0 10px; }
.day span { font-size: 11.5px; color: var(--text-2); background: var(--pill); padding: 3px 10px; border-radius: 999px; font-weight: 500; }
.run { display: flex; gap: 10px; margin-top: 12px; align-items: flex-end; }
.run.me { justify-content: flex-end; }
.run > .face { width: 28px; height: 28px; flex: none; }
.bubbles { display: flex; flex-direction: column; gap: 2px; max-width: min(76%, 540px); align-items: flex-start; }
.me .bubbles { align-items: flex-end; }
.who-name { font-size: 12px; font-weight: 600; margin: 0 0 3px 12px; }
.b { padding: 7px 12px 8px; font-size: 14.5px; line-height: 1.45; border-radius: var(--r-bubble); background: var(--asst); color: var(--asst-text); width: fit-content; }
.me .b { background: var(--user); color: var(--user-text); }
.bubbles .b:not(:last-child) { border-bottom-left-radius: 6px; }
.bubbles .b:not(:first-child) { border-top-left-radius: 6px; }
.me .bubbles .b:not(:last-child) { border-bottom-left-radius: var(--r-bubble); border-bottom-right-radius: 6px; }
.me .bubbles .b:not(:first-child) { border-top-left-radius: var(--r-bubble); border-top-right-radius: 6px; }
.b .tm { float: right; margin: 7px 0 -4px 10px; font-size: 11px; opacity: .55; font-variant-numeric: tabular-nums; }
.b code { font: .88em ui-monospace, "SF Mono", monospace; padding: 1px 5px; border-radius: 5px; background: oklch(0 0 0 / .18); }
[data-theme="porcelain"] .b code { background: oklch(0 0 0 / .06); }
.b .mention { color: var(--dot); font-weight: 500; }
.me .b .mention { color: inherit; text-decoration: underline; }
.tool { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px; border-radius: 9px; font-size: 12.5px; color: var(--text-2); box-shadow: inset 0 0 0 1px var(--divider); margin-top: 2px; }
.tool b { font-weight: 500; color: var(--text); }
.typing-b { display: inline-flex; gap: 4px; padding: 12px 14px; }
.typing-b i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: blink 1.2s infinite; }
.typing-b i:nth-child(2) { animation-delay: .2s; } .typing-b i:nth-child(3) { animation-delay: .4s; }
.receipt { font-size: 11px; color: var(--text-3); margin-top: 3px; text-align: right; }

.composer { padding: 0 24px 18px; flex: none; }
.card { max-width: 740px; margin: 0 auto; background: var(--composer); border-radius: var(--r-composer); box-shadow: inset 0 0 0 1px var(--composer-edge); padding: 11px 12px 8px 14px; }
[data-theme="porcelain"] .card { box-shadow: inset 0 0 0 1px var(--composer-edge), 0 2px 10px oklch(0 0 0 / .04); }
.card textarea { width: 100%; resize: none; border: 0; outline: 0; background: none; color: var(--text); font-size: 14.5px; line-height: 1.45; min-height: 40px; }
.card textarea::placeholder { color: var(--text-3); }
.card .row2 { display: flex; align-items: center; gap: 2px; margin-left: -6px; }
.pick { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--text-2); font-size: 12.5px; }
.pick:hover { background: var(--hover); color: var(--text); }
.pick .face { width: 16px; height: 16px; }
.send { width: 30px; height: 30px; border-radius: calc(var(--r-composer) - 8px); background: var(--send); color: var(--send-text); display: grid; place-items: center; margin-left: 4px; }
.send svg { stroke-width: 2; }

@media (max-width: 760px) { .main { display: none; } .side { width: 100%; } }
</style>
</head>
<body>
<div class="scene"><i style="left:-6%;top:8%;width:46%;height:38%;background:oklch(.34 calc(.015*var(--cm)*var(--tint)) calc(var(--hue) - 10))"></i><i style="left:30%;top:46%;width:60%;height:30%;background:oklch(.18 calc(.008*var(--cm)*var(--tint)) var(--hue))"></i><i style="right:-4%;top:-6%;width:34%;height:40%;background:oklch(.4 calc(.017*var(--cm)*var(--tint)) var(--hue))"></i><i style="left:6%;bottom:-10%;width:40%;height:34%;background:oklch(.22 calc(.015*var(--cm)*var(--tint)) calc(var(--hue) - 20))"></i></div>

<svg width="0" height="0" style="position:absolute">

9Z\" fill=\"#E5484D\"/><path d=\"M30 78 L26 92 L34 92 L36 80Z\" fill=\"#C93A40\"/></g>","lawyer":"<defs><clipPath id=\"b-lawyer\"><ellipse cx=\"48\" cy=\"57\" rx=\"32\" ry=\"30\"/></clipPath></defs><g class=\"bird-feet\"><ellipse cx=\"40\" cy=\"87.5\" rx=\"5\" ry=\"3\" fill=\"#FF9A4A\"/><ellipse cx=\"54\" cy=\"87.5\" rx=\"5\" ry=\"3\" fill=\"#FF9A4A\"/></g><g class=\"bird-body\"><path d=\"M36 32 C30 16 38 8 46 15 C45 20 47 26 52 29Z\" style=\"fill:oklch(0.66 0.17 25);stroke:oklch(0.66 0.17 25)\" stroke-width=\"3\" stroke-linejoin=\"round\"/><ellipse cx=\"48\" cy=\"57\" rx=\"32\" ry=\"30\" style=\"fill:oklch(0.66 0.17 25)\"/><g clip-path=\"url(#b-lawyer)\"><ellipse cx=\"62\" cy=\"76\" rx=\"20\" ry=\"15\" fill=\"#FFE2D8\"/><path class=\"bird-wing\" d=\"M22 60 Q31 48 46 57 Q37 71 22 60Z\" style=\"fill:oklch(0.58 0.17 25)\"/><path d=\"M58 44 Q72 40 82 48 L82 58 Q70 62 58 54Z\" fill=\"#221A20\"/><ellipse cx=\"34\" cy=\"40\" rx=\"6\" ry=\"3.6\" transform=\"rotate(-30 34 40)\" fill=\"#fff\" opacity=\".32\"/></g><path d=\"M77 47 Q90 50.5 90 53 Q90 55.5 77 59Z\" fill=\"#FF9A4A\" stroke=\"#FF9A4A\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"63\" cy=\"52\" r=\"7.4\" fill=\"#FBF4E8\"/><ellipse class=\"bird-eye\" cx=\"63\" cy=\"52\" rx=\"4.4\" ry=\"5.4\" fill=\"#221A20\"/><circle cx=\"64.5\" cy=\"50\" r=\"1.7\" fill=\"#fff\"/><circle cx=\"61.8\" cy=\"54.2\" r=\".8\" fill=\"#fff\"/><ellipse cx=\"64\" cy=\"63\" rx=\"5\" ry=\"2.8\" fill=\"#FF7C99\" opacity=\".45\"/></g>"};
const INK = { lead: "light-dark(oklch(0.5 0.06 265), oklch(0.78 0.06 265))", scout: "light-dark(oklch(0.5 0.06 60), oklch(0.78 0.06 60))", budget: "light-dark(oklch(0.5 0.14 100), oklch(0.78 0.14 100))" };
const face = (slug) => `<svg viewBox="2 1.5 104 104">${BIRDS[slug] ?? BIRDS.lead}</svg>`;
const LAYOUT = { 2: [{x:0,y:0,s:.62},{x:.38,y:.38,s:.62}], 3: [{x:.24,y:0,s:.52},{x:0,y:.46,s:.54},{x:.46,y:.46,s:.54}] };
function cut(spots, i) {
  const me = spots[i];
  const holes = spots.slice(i + 1).map(o => {
    const cx = ((o.x + o.s/2 - me.x) / me.s) * 100, cy = ((o.y + o.s/2 - me.y) / me.s) * 100, r = (o.s/2/me.s) * 100;
    return `radial-gradient(calc(${r}% + 2px) calc(${r}% + 2px) at ${cx}% ${cy}%, transparent 99%, #000 100%)`;
  });
  if (!holes.length) return "";
  const m = holes.join(", ");
  return `mask-image:${m};-webkit-mask-image:${m};mask-composite:intersect;-webkit-mask-composite:source-in;`;
}
function avatar(faces, style = "") {
  const spots = LAYOUT[Math.min(faces.length, 3)];
  if (!spots) return `<span class="face" style="${style}">${face(faces[0])}</span>`;
  return `<span class="face stack" style="${style}">${spots.map((p, i) => `<span class="face" style="left:${p.x*100}%;top:${p.y*100}%;width:${p.s*100}%;height:${p.s*100}%;${cut(spots, i)}">${face(faces[i])}</span>`).join("")}</span>`;
}

const PINNED = [

const CHATS = [
  { id: "mascot", name: "mascot ideas", faces: ["designer"], time: "now", typing: "designer is typing", sub: "designer" },
  { id: "digest", name: "research digest", faces: ["research", "critic"], time: "4m", unread: 3, mention: true, from: "critic", preview: "@keyur the second paper's sample is tiny", sub: "research, critic" },

let active = "trip", unreadOnly = false, query = "";
const $ = (s) => document.querySelector(s);

function render() {
  const match = (c) => (!query || c.name.includes(query.toLowerCase())) && (!unreadOnly || c.unread);
  const pins = PINNED.filter(match);
  $("#pins").style.display = pins.length ? "" : "none";
  $("#pins").innerHTML = pins.map(c => `
    <button class="pin" data-id="${c.id}" ${c.unread ? "data-unread" : ""} aria-current="${c.id === active}">
      <span class="circle">${avatar(c.faces)}${c.unread ? '<span class="dot"></span>' : ""}</span>
      <span class="n">${c.name}</span>
    </button>`).join("");
  $("#rows").innerHTML = CHATS.filter(match).map(c => {
    const l2 = c.typing ? `<span class="typing">${c.typing}<i></i><i></i><i></i></span>`
      : c.draft ? `<span class="draft">draft:</span> ${c.draft}`
      : `${c.from ? `<span class="from">${c.from}:</span> ` : ""}${c.preview}`;
    return `<button class="row" data-id="${c.id}" ${c.unread ? "data-unread" : ""} ${c.muted ? "data-muted" : ""} aria-current="${c.id === active}">
      ${avatar(c.faces)}
      <span class="t">
        <span class="l1"><span class="name">${c.name}</span>${c.muted ? '<svg class="i mute"><use href="#i-bell-off"/></svg>' : ""}<span class="time">${c.time}</span></span>
        <span class="l1"><span class="l2">${l2}</span>${c.mention ? '<i class="at">@</i>' : ""}${c.unread ? `<span class="count">${c.unread}</span>` : ""}</span>
      </span>
    </button>`;
  }).join("") || `<p class="label">no chats match</p>`;
  const c = [...PINNED, ...CHATS].find(x => x.id === active);
  $("#bar-face").innerHTML = avatar(c.faces, "width:26px;height:26px");
  $("#bar-name").textContent = c.name; $("#bar-sub").textContent = c.sub;
  $("#ta").placeholder = `message ${c.name}`;
}

document.addEventListener("click", (e) => { const r = e.target.closest("[data-id]"); if (r) { active = r.dataset.id; render(); } });
$("#q").oninput = (e) => { query = e.target.value; render(); };
$("#unread-only").onclick = (e) => { unreadOnly = !unreadOnly; e.currentTarget.setAttribute("aria-pressed", unreadOnly); render(); };
function toggleSide() { const s = $("#side"); s.hidden = !s.hidden; $("#expand").hidden = !s.hidden; }
$("#collapse").onclick = toggleSide; $("#expand").onclick = toggleSide;
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); $("#q").focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); toggleSide(); }
});
document.querySelectorAll("[data-bird]").forEach(el => el.innerHTML = face(el.dataset.bird));

/* controls */
const root = document.documentElement;
const NOTES = {
  graphite: "claude's dark. pure neutral greys, selection is one step lighter, counts are grey. colour only on your bubble, the dot, and @.",
  ink: "cool near-black. selection is a raised card with a hairline edge. counts take the accent, muted counts stay grey. tighter corners.",
  porcelain: "claude's light. warm paper, grey selection, counts in ink. the send button is ink too, so the accent lives in your bubble and the @.",
  frost: "monocode's glass: frosted panels over a still scene in a low-chroma shade of your colour. chrome is white at some opacity.",
};
const SW = [["plum",340,1],["bluebird",245,1],["ocean",228,.94],["periwinkle",268,1],["lilac",295,.94],["orchid",320,1],["sakura",5,.94],["coral",28,1],["sage",145,.78],["mint",172,.89],["teal",200,.83],["slate",255,.39],["graphite",255,.15],["mono",0,0]];
let st = { theme: "graphite", swatch: "bluebird", tint: 100 };
try { Object.assign(st, JSON.parse(localStorage.getItem("yuki-themes") || "{}")); } catch {}
function apply() {
  const [, h, c] = SW.find(s => s[0] === st.swatch);
  root.style.setProperty("--hue", h); root.style.setProperty("--cm", c);
  root.dataset.mono = st.swatch === "mono" ? "1" : "0";
  root.dataset.theme = st.theme;
  root.style.setProperty("--tint", st.tint / 100); $("#tint").value = st.tint; $("#tint-v").textContent = st.tint + "%";
  $("#tint-ctl").style.display = st.theme === "frost" ? "flex" : "none";
  $("#note").textContent = NOTES[st.theme];
  document.querySelectorAll("#themes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.theme));
  document.querySelectorAll("#sw button").forEach(b => b.setAttribute("aria-pressed", b.title === st.swatch));
  try { localStorage.setItem("yuki-themes", JSON.stringify(st)); } catch {}
}
SW.forEach(([n, h, c]) => { const b = document.createElement("button"); b.title = n; b.style.background = n === "mono" ? "#ddd" : `oklch(.72 ${(.12*c).toFixed(3)} ${h})`; b.onclick = () => { st.swatch = n; apply(); }; $("#sw").append(b); });
document.querySelectorAll("#themes button").forEach(b => b.onclick = () => { st.theme = b.dataset.v; apply(); });
$("#tint").oninput = (e) => { st.tint = +e.target.value; apply(); };
apply(); render();
const th = $(".thread"); const bottom = () => th.scrollTop = th.scrollHeight; bottom(); addEventListener("load", bottom); document.fonts?.ready.then(bottom);
</script>
