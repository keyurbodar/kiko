# Earendil ships pi-durable, pi-ai and chord together at one version. One weekly PR bumps all three, and CI,
# including the storage conformance suite, decides whether it merges. Other dependencies are updated by hand.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "@earendil-works/*"
    groups:
      pi:
        patterns:
          - "@earendil-works/*"
