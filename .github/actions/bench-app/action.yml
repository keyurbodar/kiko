name: Bench app driver
description: Build the kiko app, fetch its engines and sign it on macOS, so the bench can start it and point KIKO_DRIVER at its socket.
inputs:
  cert:
    description: base64 of the macOS signing certificate
    default: ""
  password:
    description: password of the macOS signing certificate
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop

    - name: Build the app on Linux
      if: runner.os == 'Linux'
      shell: bash
      working-directory: apps/desktop
      run: cargo build --release --locked -p kiko-app

    - name: Build the app on macOS
      if: runner.os == 'macOS'
      shell: bash
      working-directory: apps/desktop
      run: |
        rustup target add aarch64-apple-darwin
        cargo build --release --locked --target aarch64-apple-darwin -p kiko-app

    - name: Build the daemon on macOS
      if: runner.os == 'macOS'
      shell: bash
      timeout-minutes: 20
      run: bun apps/computer/scripts/build.ts darwin-arm64

    - name: Fetch the engines on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        cua="$(bash apps/desktop/scripts/fetch-cua-driver.sh linux-x64 "$RUNNER_TEMP/cua")"
        browser="$(bash apps/desktop/scripts/fetch-agent-browser.sh linux-x64 "$RUNNER_TEMP/browser")"
        echo "KIKO_BIN=${{ github.workspace }}/apps/desktop/target/release/kiko" >> "$GITHUB_ENV"
        echo "KIKO_CUA=$cua" >> "$GITHUB_ENV"
        echo "KIKO_AGENT_BROWSER=$browser" >> "$GITHUB_ENV"

    - name: Fetch the engines on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        cua="$(bash apps/desktop/scripts/fetch-cua-driver.sh darwin-universal "$RUNNER_TEMP/cua")"
        browser="$(bash apps/desktop/scripts/fetch-agent-browser.sh darwin-arm64 "$RUNNER_TEMP/browser")"
        echo "CUA_BIN=$cua" >> "$GITHUB_ENV"
        echo "BROWSER_BIN=$browser" >> "$GITHUB_ENV"

    - name: Import the signing identity on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        CERT: ${{ inputs.cert }}
        PASSWORD: ${{ inputs.password }}
      run: |
        PASSWORD="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
        KEYCHAIN="$RUNNER_TEMP/kiko.keychain-db"
        security create-keychain -p "$PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
        printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/kiko.p12"
        security import "$RUNNER_TEMP/kiko.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        openssl pkcs12 -in "$RUNNER_TEMP/kiko.p12" -clcerts -nokeys -passin "pass:$PASSWORD" -out "$RUNNER_TEMP/kiko.pem"
        sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/kiko.pem"
        rm -f "$RUNNER_TEMP/kiko.p12" "$RUNNER_TEMP/kiko.pem"

    - name: Bundle and sign on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        KIKO_BIN: ${{ github.workspace }}/apps/desktop/target/aarch64-apple-darwin/release/kiko
        KIKO_CORE_BIN: ${{ github.workspace }}/apps/computer/dist/kiko-computer-darwin-arm64
        KIKO_CUA_BIN: ${{ env.CUA_BIN }}
        KIKO_AGENT_BROWSER_BIN: ${{ env.BROWSER_BIN }}
      run: bash apps/desktop/scripts/bundle-macos.sh arm64 dist kiko

    - name: Grant Accessibility and Screen Recording on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        app="${{ github.workspace }}/dist/kiko.app/Contents/MacOS/kiko"
        driver="${{ github.workspace }}/dist/kiko.app/Contents/MacOS/cua-driver"
        database="/Library/Application Support/com.apple.TCC/TCC.db"
        now=$(date +%s)
        for client in "$app" "$driver"; do
          for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
            sudo sqlite3 "$database" \
              "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
               VALUES('${service}','${client}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${now});"
          done
        done
        sudo killall tccd 2>/dev/null || true
        sleep 2
        pgrep -lx tccd || sudo launchctl kickstart -k system/com.apple.tccd || true
        sudo sqlite3 "$database" "SELECT service, client, auth_value FROM access WHERE client LIKE '%kiko%';"

    - name: Export the bundled app on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        echo "KIKO_BIN=${{ github.workspace }}/dist/kiko.app/Contents/MacOS/kiko" >> "$GITHUB_ENV"
        echo "KIKO_CUA=${{ github.workspace }}/dist/kiko.app/Contents/MacOS/cua-driver" >> "$GITHUB_ENV"
        echo "KIKO_AGENT_BROWSER=${{ github.workspace }}/dist/kiko.app/Contents/MacOS/agent-browser" >> "$GITHUB_ENV"
