name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        working-directory: apps/web-solid
      - run: bun scripts/bundle-budget.ts

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web-solid
      - working-directory: apps/server
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CREDENTIALS_KEK=$(openssl rand -base64 32)"
          } > .dev.vars
      - working-directory: apps/server
        env:
          NODE_ENV: development
        run: nohup bunx wrangler dev --port 8787 --inspector-port 9229 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
      - run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8787/api/health && exit 0
            sleep 2
          done
          tail -n 50 "$RUNNER_TEMP/wrangler.log"
          exit 1
      - shell: bash
        run: |
          set -o pipefail
          bun kiko verify journal-overhead --url http://localhost:8787 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/wrangler.log
          if-no-files-found: ignore
          retention-days: 7

  check-all:
    name: All checks
    if: ${{ always() }}
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
