name: ci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".cursor/**"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".cursor/**"
      - "LICENSE*"

# A push to a pull request cancels the older run for that branch: three pushes ran three full verifies at
# once, and only the last one's result counts. A push to main is never cancelled, and is grouped by its
# commit rather than the ref. Cancelling it would leave that merge commit with no successful run, and
# deploy waits for one: the commit would never ship.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which paths a push touched. A client-only change does not need the 15-minute backend suites: the
  # client build is covered by bundle-budget, and its tests by check. Anything the worker loads does.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch or a rewritten history has no usable base: run everything.
          if ! git rev-parse --verify -q "$base" > /dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD || true)"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # An empty diff means the base is wrong, not that nothing changed. Run everything.
          if [ -z "$changed" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(apps/server|core|packages|apps/cli|scripts)/|^(bun\.lock|package\.json|tsconfig\.json|\.github/workflows/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    # The safety net: typecheck, lint, the import and rule checks, and the unit tests for every package.
    # It runs on any push that is not docs-only, because it is the only thing that typechecks and tests
    # the client.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Server test files already run in their own process and cache a pass by a hash of the test and every
      # repo file it reaches (apps/server/scripts/test-each.ts). A fresh runner had no cache, so all of them
      # ran every time: 358 s against 28 s on a warm machine. Restoring the newest cache is safe because
      # every entry is checked against that hash and a stale one just runs again; the key only has to be
      # newer than the cache it replaces. Restored after install, since install owns node_modules.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/kiko-tests
          key: kiko-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: kiko-tests-${{ runner.os }}-
      - run: bun run check

  # Real backend verification. It needs no repository secret and no model key, so it is
  # safe for a pull request from a fork. It has only the read-only `contents` permission.
  #
  # It is the expensive job: it boots a worker and runs the model-free suites. It changes nothing
  # outside the backend and the code the backend loads, so a change that only touches the client, the
  # docs, or CI config does not need it. `check` still runs for those, and runs the unit tests for every
  # package including this one.
  verify:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The suites ran one after another on one runner, so the job took as long as the sum: 14 minutes, with
    # the ten slowest suites 73 percent of it. Four shards run them side by side, each ~3.5 minutes. The
    # shard assignment is weighted by recorded duration (apps/cli/src/verify/weights.ts), so the slow suites
    # spread out instead of piling onto one runner.
    #
    # The load tests are skipped here. They send thousands of writes to measure scale rather than behavior;
    # they run against a local server by name when a change touches routines or search.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: build the client assets
        run: bun run build
        working-directory: apps/web-solid
      - name: write throwaway dev vars
        # Random values made in this job. They protect nothing and never leave the runner.
        working-directory: apps/server
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CREDENTIALS_KEK=$(openssl rand -base64 32)"
          } > .dev.vars
      - name: write the release key
        # The update suite signs a release that the worker's baked-in public key must trust,
        # so the real key is written. Where secrets are withheld, a throwaway key stands in.
        env:
          RELEASE_KEY_JSON: ${{ secrets.RELEASE_KEY_JSON }}
        run: |
          mkdir -p "$HOME/.config/kiko"
          if [ -n "$RELEASE_KEY_JSON" ]; then
            printf '%s' "$RELEASE_KEY_JSON" > "$HOME/.config/kiko/release-key.json"
          else
            bun scripts/release.ts --init-key
          fi
          chmod 600 "$HOME/.config/kiko/release-key.json"
      - name: start the worker
        working-directory: apps/server
        env:
          NODE_ENV: development
        run: nohup bunx wrangler dev --port 8787 --inspector-port 9229 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
      - name: wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8787/api/health && exit 0
            sleep 2
          done
          echo "the worker did not become healthy"
          tail -n 50 "$RUNNER_TEMP/wrangler.log"
          exit 1
      - name: run the model-free suites
        # A failing suite prints its last frames. They go to a file for the artifact.
        # 20k filler messages do not fit the suite's 120 s window on a shared runner, so the
        # load is shrunk; the functional checks and pagination still run.
        env:
          KIKO_SEARCH_MESSAGES: "2000"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        shell: bash
        run: |
          set -o pipefail
          bun kiko verify --no-model --no-load --shard "$SHARD" --shards "$SHARDS" --url http://localhost:8787 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: upload the last frames and the worker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-frames-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/verify.log
            ${{ runner.temp }}/wrangler.log
          if-no-files-found: ignore
          retention-days: 7

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web-solid
      - run: bun scripts/bundle-budget.ts

  # One job whose name never changes, so branch protection needs no edit when a job is split or re-sharded.
  # A skipped job counts as success to branch protection, so this fails when any job did not actually
  # succeed: verify skips only when `changes` said the change cannot affect the backend, which is the one
  # legitimate skip. `always()` rather than `!cancelled()` so a cancelled run still produces a failure.
  check-all:
    name: All checks
    if: ${{ always() }}
    needs: [changes, check, verify, bundle-budget]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass, or to skip for a reason
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .changes.outputs as $gates
            | all(to_entries[];
                .value.result == "success"
                or (.key == "verify" and .value.result == "skipped" and $gates.backend == "false"))' > /dev/null
