name: probe

on:
  push:
    branches:
      - "t3/cu-*"
    paths:
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  plan:
    name: Probe plan
    runs-on: ubuntu-24.04
    outputs:
      host: ${{ steps.plan.outputs.host }}
    steps:
      - id: plan
        run: |
          echo 'host={"include":[{"env":"a","n":1},{"env":"b","n":2}]}' >> "$GITHUB_OUTPUT"
          echo "wrote the host output"

  use-needs:
    name: Probe needs ${{ matrix.env }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.host) }}
    steps:
      - run: echo "needs env=${{ matrix.env }} n=${{ matrix.n }}"

  use-static:
    name: Probe static ${{ matrix.env }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON('{"include":[{"env":"a"},{"env":"b"}]}') }}
    steps:
      - run: echo "static env=${{ matrix.env }}"
