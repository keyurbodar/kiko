name: desktop terminal

on:
  push:
    branches: ["t3/cu-*"]
    paths:
      - "apps/computer/**"
      - "core/computer/**"
      - "apps/server/src/agent/computer/**"
      - "apps/server/src/computer/**"
      - ".github/workflows/desktop-terminal.yml"
  pull_request:
    paths:
      - "apps/computer/**"
      - "core/computer/**"
      - "apps/server/src/agent/computer/**"
      - "apps/server/src/computer/**"
      - ".github/workflows/desktop-terminal.yml"

permissions:
  contents: read

concurrency:
  group: desktop-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    name: terminal on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Report the tools
        shell: bash
        run: |
          bun --version
          python --version || python3 --version
          vim --version | head -1 || echo "no vim"
      - name: Unit tests
        run: bun run --cwd apps/computer test
      - name: End to end
        run: bun run --cwd apps/computer e2e:terminal
