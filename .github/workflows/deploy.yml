name: deploy

on:
  workflow_call:
    inputs:
      ref:
        description: "commit to deploy; defaults to the caller's commit"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy
      cancel-in-progress: false
      queue: max
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLERK_JWT_KEY: ${{ vars.CLERK_JWT_KEY }}
    steps:
      - name: require the installer's Clerk key
        run: |
          case "$CLERK_JWT_KEY" in
            "-----BEGIN PUBLIC KEY-----"*) ;;
            *) echo "Set the CLERK_JWT_KEY repository variable to the Clerk PEM public key before deploying." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: fetch the release tags
        run: git fetch --force --tags origin
      - name: write the release signing key
        env:
          RELEASE_KEY_JSON: ${{ secrets.RELEASE_KEY_JSON }}
        run: |
          mkdir -p "$HOME/.config/kiko"
          printf '%s' "$RELEASE_KEY_JSON" > "$HOME/.config/kiko/release-key.json"
          chmod 600 "$HOME/.config/kiko/release-key.json"
      - name: build the client
        working-directory: apps/web-solid
        env:
          NODE_ENV: production
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          VITE_INSTALLER_URL: https://api.kiko.works
        run: bun run build
      - name: keep the kiko app archives the release ships
        id: app-assets
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: kiko-app-*
          path: ${{ runner.temp }}/kiko-app
          merge-multiple: true
      - name: build and sign the release
        env:
          KIKO_APP_ASSETS: ${{ steps.app-assets.outcome == 'success' && format('{0}/kiko-app', runner.temp) || '' }}
        run: bun scripts/release.ts
      - name: keep the computer binaries for the release
        uses: actions/upload-artifact@v4
        with:
          name: computer-binaries
          path: dist-release/computer
          retention-days: 1
          if-no-files-found: error
      - name: guard a released version
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dist-release/latest-owner.json)"
          case "$version" in *[!0-9.]*|"") echo "unreadable built version: $version" >&2; exit 1 ;; esac
          live_version="$(curl -sf https://app.kiko.works/releases/latest-owner.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' || true)"
          live="$(curl -sf "https://app.kiko.works/releases/$version/manifest.json" || true)"
          case "$live" in *"\"version\": \"$version\""*) ;; *) live="" ;; esac
          if [ -n "$live" ] && [ "$live" != "$(cat "dist-release/$version/manifest.json")" ]; then
            echo "Version $version is already released with other code. Bump the version in package.json." >&2
            exit 1
          fi
          newest="$(printf '%s\n%s\n' "$version" "$live_version" | sort -V | tail -1)"
          if [ -n "$live_version" ] && [ "$newest" != "$version" ]; then
            echo "$version is older than the live $live_version. Refusing to put an older release back." >&2
            exit 1
          fi
      - name: assemble every served release
        run: |
          store="$RUNNER_TEMP/releases"
          mkdir -p "$store"
          live="$(curl -sf https://app.kiko.works/releases/latest-owner.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' || true)"
          bun scripts/sync-releases.ts "$store" https://app.kiko.works/releases $(git tag -l 'v*' | sed 's/^v//') $live
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dist-release/latest-owner.json)"
          rm -rf "$store/$version" && cp -r "dist-release/$version" "$store/$version"
          rm -rf apps/web-solid/dist/releases
          cp -r "$store" apps/web-solid/dist/releases
          cp dist-release/latest-owner.json apps/web-solid/dist/releases/
      - name: keep the live build's assets so open tabs can still load them
        run: bun scripts/keep-live-assets.ts apps/web-solid/dist/assets https://app.kiko.works
      - name: deploy the front door and the installer
        working-directory: infra
        env:
          ALCHEMY_TELEMETRY_DISABLED: "1"
          CI: "1"
        run: |
          bunx alchemy provider cloudflare bootstrap --no-input
          bun run deploy --no-input
