name: computer-windows

on:
  push:
    branches: ["t3/cu-*"]
    paths:
      - "apps/computer/**"
      - "core/computer/**"
      - ".github/workflows/computer-windows.yml"

permissions:
  contents: read

concurrency:
  group: computer-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keys:
    name: Windows live keys
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Unit tests
        run: bunx vitest run apps/computer/src
      - name: Type an arrow chord into a text box
        run: bun apps/computer/scripts/windows-roundtrip.ts
