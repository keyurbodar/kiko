name: bench desktop environments

on:
  push:
    branches:
      - "t3/cu-desktop-everywhere"
    paths:
      - "apps/bench/**"
      - ".github/workflows/bench-desktop-envs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-desktop-envs-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG: apps/bench/desktop-everywhere.json
  TASK: "desktop-1*"
  OPENCODE_GO_KEY: ${{ secrets.OPENCODE_GO_KEY }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      host: ${{ steps.plan.outputs.host }}
      container: ${{ steps.plan.outputs.container }}
      vm: ${{ steps.plan.outputs.vm }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - id: plan
        run: |
          set -euo pipefail
          nixos_id="nixos-25.05@$(sed -n 's#.*github:NixOS/nixpkgs/\([0-9a-f]\{12\}\).*#\1#p' apps/bench/envs/nixos-25.05/flake.nix)"
          omarchy_sha="$(sed -n 's/^ARCH_SHA256=\([0-9a-f]\{12\}\).*/\1/p' apps/bench/envs/omarchy-v3.8.4/image.env)"
          omarchy_id="omarchy-v3.8.4@$omarchy_sha"
          label='map(if .env=="nixos-25.05" then .machine=$nixos elif .env=="omarchy-v3.8.4" then .machine=$omarchy else . end)'
          bun run bench plan --config "$CONFIG" --validate > validate.json
          for kind in host container vm; do
            jq -c --arg nixos "$nixos_id" --arg omarchy "$omarchy_id" ".$kind |= $label | .$kind" validate.json > "validate-$kind.json"
            printf '%s={"include":%s}\n' "$kind" "$(cat "validate-$kind.json")" >> "$GITHUB_OUTPUT"
          done
          echo "::notice::planned $(jq length validate-host.json) host, $(jq length validate-container.json) container, $(jq length validate-vm.json) vm validations"

  nixos-image:
    name: NixOS image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        id: cache
        with:
          path: .nix-vm
          key: nixos-vm-${{ hashFiles('apps/bench/envs/nixos-25.05/flake.nix', 'apps/bench/envs/nixos-25.05/configuration.nix') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash apps/bench/scripts/envs/nixos-image.sh build .nix-vm

  omarchy-image:
    name: Omarchy image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: .omarchy-image
          key: omarchy-image-v3.8.4-08754e28d91b-2
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage sshpass openssl
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          bash apps/bench/scripts/envs/build-omarchy-image.sh .omarchy-image/omarchy.qcow2

  validate-host:
    name: Validate ${{ matrix.env }}
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.host) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install the desktop test bed
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth openbox dbus-x11 at-spi2-core python3-gi gir1.2-gtk-3.0 x11-utils jq \
            libreoffice-calc libreoffice-writer
      - name: Environment packages
        if: runner.os == 'macOS'
        run: bash apps/bench/envs/macos-15/setup.sh
      - name: Validate
        if: runner.os == 'Linux'
        run: bash apps/bench/scripts/display.sh bun run bench validate --config "$CONFIG" --task "$TASK" --track desktop --results results --machine ${{ matrix.machine }}
      - name: Validate
        if: runner.os == 'macOS'
        run: bun run bench validate --config "$CONFIG" --task "$TASK" --track desktop --results results --machine ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-desktop-validate-${{ matrix.env }}
          path: results/
          if-no-files-found: warn

  validate-container:
    name: Validate ${{ matrix.env }}
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.container) }}
    steps:
      - name: Base packages
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl nodejs unzip
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Environment packages
        run: bash apps/bench/envs/debian-13/setup.sh
      - name: Validate
        run: bash apps/bench/envs/debian-13/display.sh bun run bench validate --config "$CONFIG" --task "$TASK" --track desktop --results results --machine ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-desktop-validate-${{ matrix.env }}
          path: results/
          if-no-files-found: warn

  validate-vm:
    name: Validate ${{ matrix.env }}
    needs: [plan, nixos-image, omarchy-image]
    if: always() && needs.plan.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.vm) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils sshpass rsync
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: cachix/install-nix-action@v31
        if: startsWith(matrix.env, 'nixos')
      - uses: actions/cache/restore@v4
        if: startsWith(matrix.env, 'nixos')
        with:
          path: .nix-vm
          key: nixos-vm-${{ hashFiles('apps/bench/envs/nixos-25.05/flake.nix', 'apps/bench/envs/nixos-25.05/configuration.nix') }}
      - uses: actions/cache/restore@v4
        if: startsWith(matrix.env, 'omarchy')
        with:
          path: .omarchy-image
          key: omarchy-image-v3.8.4-08754e28d91b-2
      - name: Resolve the image
        id: image
        run: |
          set -euo pipefail
          if [ "${{ matrix.env }}" = "nixos-25.05" ]; then
            echo "path=$(bash apps/bench/scripts/envs/nixos-image.sh restore .nix-vm)" >> "$GITHUB_OUTPUT"
          else
            test -f .omarchy-image/omarchy.qcow2
            echo "path=.omarchy-image/omarchy.qcow2" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate
        run: |
          bash apps/bench/scripts/envs/vm-run.sh \
            "${{ matrix.env }}" "${{ steps.image.outputs.path }}" results 2222 \
            desktop kiko -- \
            validate --config "$CONFIG" --task "$TASK" --track desktop --results results --machine "${{ matrix.machine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-desktop-validate-${{ matrix.env }}
          path: results/
          if-no-files-found: warn
