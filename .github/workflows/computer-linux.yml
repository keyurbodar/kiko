name: computer-linux

on:
  push:
    branches: ["t3/cu-*"]
    paths:
      - "apps/computer/**"
      - "core/computer/**"
      - ".github/workflows/computer-linux.yml"

permissions:
  contents: read

concurrency:
  group: computer-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xgetimage:
    name: X11 capture on Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: bunx vitest run apps/computer/src
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Capture past the edge of the root window
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun apps/computer/scripts/linux-xgetimage.ts
