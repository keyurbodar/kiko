name: desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
  push:
    branches:
      - "t3/bg-*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          sudo apt-get update
          sudo apt-get install -y dbus xvfb
      - name: Format
        working-directory: apps/desktop
        run: cargo fmt -p kiko-app -- --check
      - name: Lint
        working-directory: apps/desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: apps/desktop
        run: dbus-run-session -- xvfb-run -a cargo test --all-targets
      - name: Build
        working-directory: apps/desktop
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cp apps/desktop/target/release/kiko dist/
          cp apps/desktop/packaging/kiko.desktop dist/
          tar -czf kiko-linux-x64.tar.gz -C dist kiko kiko.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: kiko-linux-x64
          path: kiko-linux-x64.tar.gz

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Toolchain
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build kiko for both architectures
        working-directory: apps/desktop
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/kiko target/x86_64-apple-darwin/release/kiko -output "$RUNNER_TEMP/kiko"
      - name: Install the workspace
        run: bun install --frozen-lockfile
      - name: Build the daemon for both architectures
        run: |
          bun apps/computer/scripts/build.ts darwin-arm64 darwin-x64
          lipo -create apps/computer/dist/kiko-computer-darwin-arm64 apps/computer/dist/kiko-computer-darwin-x64 -output "$RUNNER_TEMP/kiko-core"
      - name: Import the signing identity
        env:
          CERT: ${{ secrets.KIKO_MACOS_CERT_P12 }}
          PASSWORD: ${{ secrets.KIKO_MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/kiko.keychain-db"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/kiko.p12"
          security import "$RUNNER_TEMP/kiko.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/kiko.p12"
      - name: Bundle and sign
        env:
          KIKO_BIN: ${{ runner.temp }}/kiko
          KIKO_CORE_BIN: ${{ runner.temp }}/kiko-core
        run: bash apps/desktop/scripts/bundle-macos.sh arm64 dist kiko
      - name: Verify the designated requirement
        run: |
          expected="$(cat apps/desktop/macos-requirement.txt)"
          actual="$(codesign -d -r- dist/kiko.app 2>&1 | sed -n 's/^designated => //p')"
          echo "designated: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the designated requirement changed; TCC grants would not survive an update"
            exit 1
          fi
          codesign --verify --strict dist/kiko.app
      - name: Version
        run: dist/kiko.app/Contents/MacOS/kiko --version
      - name: Smoke test
        working-directory: apps/desktop
        run: cargo test -p kiko-app --test smoke -- --test-threads=1
      - name: Menu bar screenshot
        run: |
          dist/kiko.app/Contents/MacOS/kiko &
          sleep 6
          screencapture -x "$RUNNER_TEMP/menu-bar.png" || echo "::warning::screencapture needs the screen recording grant on this runner"
          kill %1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: kiko-macos-menu-bar
          path: ${{ runner.temp }}/menu-bar.png
          if-no-files-found: warn
      - name: Package
        run: ditto -c -k --keepParent dist/kiko.app kiko-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kiko-macos-universal
          path: kiko-macos-universal.zip

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Build
        working-directory: apps/desktop
        run: cargo build --release --locked
      - name: Check the embedded manifest
        shell: pwsh
        run: |
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $mt) { throw "mt.exe is missing" }
          & $mt.FullName -nologo "-inputresource:apps/desktop/target/release/kiko.exe;#1" -out:manifest.xml
          $manifest = Get-Content manifest.xml -Raw
          if ($manifest -notmatch "PerMonitorV2") { throw "the manifest does not set PerMonitorV2" }
          if ($manifest -notmatch "asInvoker") { throw "the manifest does not request asInvoker" }
          Get-Content manifest.xml
      - name: Version
        run: apps/desktop/target/release/kiko.exe --version
      - name: Smoke test
        working-directory: apps/desktop
        run: cargo test -p kiko-app --test smoke -- --test-threads=1
      - name: Package
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun apps/computer/scripts/build.ts windows-x64
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item apps/desktop/target/release/kiko.exe dist/kiko.exe
          Copy-Item apps/computer/dist/kiko-computer-windows-x64.exe dist/kiko-core.exe
          Compress-Archive -Path dist/kiko.exe, dist/kiko-core.exe -DestinationPath kiko-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: kiko-windows-x64
          path: kiko-windows-x64.zip
