name: bench

on:
  push:
    branches:
      - "t3/cu-*"
    paths:
      - "apps/bench/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENCODE_GO_KEY: ${{ secrets.OPENCODE_GO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth openbox || true
      - name: Bench
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a -s "-screen 0 1280x800x24" sh -c 'openbox >/dev/null 2>&1 & exec bun run bench run --ci --machine gha-ubuntu-24.04-x11 --results results'
          else
            bun run bench run --ci --machine gha-ubuntu-24.04-x11 --results results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ubuntu-24.04
          path: results/
          if-no-files-found: warn

  macos:
    name: macOS 15
    needs: ubuntu
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OPENCODE_GO_KEY: ${{ secrets.OPENCODE_GO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bench
        run: bun run bench run --ci --machine gha-macos-15 --results results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-macos-15
          path: results/
          if-no-files-found: warn

  windows:
    name: Windows 2025
    needs: ubuntu
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCODE_GO_KEY: ${{ secrets.OPENCODE_GO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bench
        run: bun run bench run --ci --machine gha-windows-2025 --results results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows-2025
          path: results/
          if-no-files-found: warn
