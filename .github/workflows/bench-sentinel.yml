name: Bench sentinel

on:
  push:
    branches:
      - "t3/cu-*"
    paths:
      - "apps/bench/src/sentinel/**"
      - "apps/bench/src/types.ts"
      - "apps/bench/ci.json"
      - ".github/workflows/bench-sentinel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel:
    name: sentinel ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Read the run parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          idle=$(node -e 'console.log(require("./apps/bench/ci.json").sentinel?.idleSeconds ?? 30)')
          seconds=$(node -e 'console.log(require("./apps/bench/ci.json").sentinel?.caseSeconds ?? 4)')
          echo "idle_seconds=$idle" >> "$GITHUB_OUTPUT"
          echo "case_seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Start an X11 display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox x11-utils xdotool python3-xlib
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          sleep 1
          DISPLAY=:99 openbox &
          sleep 1
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          xdpyinfo -display :99 | head -5

      - name: Build and trust the sentinel
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kiko-sentinel"
          swiftc -O apps/bench/src/sentinel/native/macos/Sentinel.swift -o "$RUNNER_TEMP/kiko-sentinel/Sentinel"
          swiftc -O apps/bench/fixtures/sentinel/macos/OtherWindow.swift -o "$RUNNER_TEMP/kiko-sentinel/OtherWindow"
          echo "KIKO_SENTINEL_BIN=$RUNNER_TEMP/kiko-sentinel/Sentinel" >> "$GITHUB_ENV"
          echo "KIKO_OTHER_WINDOW_BIN=$RUNNER_TEMP/kiko-sentinel/OtherWindow" >> "$GITHUB_ENV"
          database="/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          for client in "$RUNNER_TEMP/kiko-sentinel/Sentinel" "$RUNNER_TEMP/kiko-sentinel/OtherWindow"; do
            sudo sqlite3 "$database" \
              "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
               VALUES('kTCCServiceAccessibility','${client}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${now});"
          done
          sudo killall tccd 2>/dev/null || true
          sleep 2
          sudo sqlite3 "$database" "SELECT service, client, auth_value FROM access WHERE client LIKE '%kiko-sentinel%';"

      - name: Run the sentinel cases
        run: >-
          bun apps/bench/src/sentinel/ci.ts
          --out sentinel-${{ matrix.os }}.json
          --logs sentinel-logs
          --idle-seconds ${{ steps.params.outputs.idle_seconds }}
          --case-seconds ${{ steps.params.outputs.case_seconds }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-${{ matrix.os }}
          path: |
            sentinel-${{ matrix.os }}.json
            sentinel-logs
          if-no-files-found: warn
