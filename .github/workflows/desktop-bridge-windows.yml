name: desktop-bridge-windows

on:
  push:
    branches:
      - "t3/bg-*"

permissions:
  contents: read

concurrency:
  group: desktop-bridge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    name: Driver client over a named pipe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bunx vitest run apps/computer/src/driver.test.ts
