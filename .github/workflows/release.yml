name: release

# Bumps the version, tags the commit, deploys through the deploy workflow, and opens a
# GitHub release. Manual only: a release is a deliberate act, never a side effect of a push.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "which version field to bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - id: bump
        env:
          PART: ${{ inputs.part }}
        run: |
          new="$(bun -e 'const pkg = await Bun.file("package.json").json(); const [a, b, c] = pkg.version.split(".").map(Number); const part = process.env.PART; pkg.version = part === "major" ? `${a + 1}.0.0` : part === "minor" ? `${a}.${b + 1}.0` : `${a}.${b}.${c + 1}`; await Bun.write("package.json", `${JSON.stringify(pkg, null, 2)}\n`); console.log(pkg.version)')"
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "v$new already exists" >&2
            exit 1
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump the version to $VERSION"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin main --follow-tags

  deploy:
    needs: bump
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  publish:
    needs: [bump, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: publish the github release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: gh release create "v$VERSION" --repo "${{ github.repository }}" --title "v$VERSION" --generate-notes
