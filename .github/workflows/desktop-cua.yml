name: desktop cua

on:
  push:
    branches:
      - "t3/cu-*"
    paths:
      - "apps/desktop/**"
      - "apps/computer/**"
      - "core/computer/**"
      - "apps/server/src/computer/**"
      - "apps/server/src/agent/computer/**"
      - ".github/workflows/desktop-cua.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/computer/**"
      - "core/computer/**"
      - "apps/server/src/computer/**"
      - "apps/server/src/agent/computer/**"
      - ".github/workflows/desktop-cua.yml"

permissions:
  contents: read

concurrency:
  group: desktop-cua-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BUN_VERSION: "1.3.14"

jobs:
  linux:
    name: cua smoke on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the test desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core dbus-x11 gir1.2-gtk-3.0 openbox python3-gi x11-utils xdotool xvfb
      - name: Build kiko
        working-directory: apps/desktop
        run: cargo build --release --locked -p kiko-app
      - name: Fetch the desktop engine
        run: |
          cua="$(bash apps/desktop/scripts/fetch-cua-driver.sh linux-x64 "$RUNNER_TEMP/cua")"
          echo "CUA_BIN=$cua" >> "$GITHUB_ENV"
      - name: Smoke
        env:
          KIKO_BIN: ${{ github.workspace }}/apps/desktop/target/release/kiko
          KIKO_CUA: ${{ env.CUA_BIN }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/dev/null 2>&1 &
          export DISPLAY=:99
          for _ in $(seq 1 100); do
            if xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          export NO_AT_BRIDGE=0
          dbus-run-session -- bash -euo pipefail -c '
            openbox --sm-disable >/dev/null 2>&1 &
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
              --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>" >/dev/null 2>&1 || true
            bun apps/desktop/scripts/cua-smoke.ts | tee "$RUNNER_TEMP/cua-smoke.json"
          '

  macos:
    name: cua smoke on macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Build kiko
        working-directory: apps/desktop
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin -p kiko-app
      - name: Build the daemon
        timeout-minutes: 20
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun apps/computer/scripts/build.ts darwin-arm64
      - name: Fetch the desktop engine
        run: |
          cua="$(bash apps/desktop/scripts/fetch-cua-driver.sh darwin-universal "$RUNNER_TEMP/cua")"
          echo "CUA_BIN=$cua" >> "$GITHUB_ENV"
      - name: Import the signing identity
        env:
          CERT: ${{ secrets.KIKO_MACOS_CERT_P12 }}
          PASSWORD: ${{ secrets.KIKO_MACOS_CERT_PASSWORD }}
        run: |
          PASSWORD="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
          KEYCHAIN="$RUNNER_TEMP/kiko.keychain-db"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/kiko.p12"
          security import "$RUNNER_TEMP/kiko.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/kiko.p12" -clcerts -nokeys -passin "pass:$PASSWORD" -out "$RUNNER_TEMP/kiko.pem"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/kiko.pem"
          rm -f "$RUNNER_TEMP/kiko.p12" "$RUNNER_TEMP/kiko.pem"
      - name: Bundle and sign
        env:
          KIKO_BIN: ${{ github.workspace }}/apps/desktop/target/aarch64-apple-darwin/release/kiko
          KIKO_CORE_BIN: ${{ github.workspace }}/apps/computer/dist/kiko-computer-darwin-arm64
          KIKO_CUA_BIN: ${{ env.CUA_BIN }}
        run: bash apps/desktop/scripts/bundle-macos.sh arm64 dist kiko
      - name: Grant Accessibility and Screen Recording to kiko
        env:
          APP: ${{ github.workspace }}/dist/kiko.app/Contents/MacOS/kiko
          DRIVER: ${{ github.workspace }}/dist/kiko.app/Contents/MacOS/cua-driver
        run: |
          set -euo pipefail
          database="/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          for client in "$APP" "$DRIVER"; do
            for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
              sudo sqlite3 "$database" \
                "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
                 VALUES('${service}','${client}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${now});"
            done
          done
          sudo killall tccd 2>/dev/null || true
          sleep 2
          pgrep -lx tccd || sudo launchctl kickstart -k system/com.apple.tccd || true
          sudo sqlite3 "$database" "SELECT service, client, auth_value FROM access WHERE client LIKE '%kiko%';"
      - name: Smoke
        env:
          KIKO_BIN: ${{ github.workspace }}/dist/kiko.app/Contents/MacOS/kiko
          KIKO_CUA: ${{ github.workspace }}/dist/kiko.app/Contents/MacOS/cua-driver
        run: |
          set -o pipefail
          bun apps/desktop/scripts/cua-smoke.ts | tee "$RUNNER_TEMP/cua-smoke.json"
      - name: Upload the smoke record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cua-smoke-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/cua-smoke.json
          if-no-files-found: warn

  windows:
    name: cua smoke on Windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Build kiko
        working-directory: apps/desktop
        run: cargo build --release --locked -p kiko-app
      - name: Fetch the desktop engine
        shell: pwsh
        run: |
          $cua = & apps/desktop/scripts/fetch-cua-driver.ps1 windows-x64 "$env:RUNNER_TEMP\cua" | Select-Object -Last 1
          "CUA_BIN=$cua" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Smoke
        shell: pwsh
        env:
          KIKO_BIN: ${{ github.workspace }}\apps\desktop\target\release\kiko.exe
          KIKO_CUA: ${{ env.CUA_BIN }}
        run: |
          bun apps/desktop/scripts/cua-smoke.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
