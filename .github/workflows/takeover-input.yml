name: takeover-input

on:
  push:
    branches: ["t3/cu-*"]
    paths:
      - "apps/computer/src/live/**"
      - "apps/computer/src/caps.ts"
      - "apps/computer/src/serve.ts"
      - "apps/server/scripts/measure-input.ts"
      - "apps/server/src/computer/**"
      - "apps/web-solid/src/chat/computer/**"
      - "core/computer/src/wire.ts"
      - ".github/workflows/takeover-input.yml"

permissions:
  contents: read

concurrency:
  group: takeover-input-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BUN_VERSION: "1.3.14"

jobs:
  linux:
    name: paste and display pick on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install the desktop, clipboard and X tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg weston xwayland x11-utils x11-xserver-utils xclip xdotool xvfb
      - name: Install Chromium
        run: node apps/server/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build the web app
        run: bun run build
      - name: Paste a Unicode string and pick a display
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 2600x900x24 -nolisten tcp >/dev/null 2>&1 &
          export DISPLAY=:99
          for _ in $(seq 1 100); do
            if xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          weston --backend=x11 --output-count=2 --width=1280 --height=800 --xwayland --socket=wayland-kiko --log=weston.log &
          for _ in $(seq 1 200); do
            if grep -q 'xserver listening on display' weston.log 2>/dev/null; then break; fi
            sleep 0.1
          done
          export DISPLAY="$(sed -n 's/.*xserver listening on display \(:[0-9]*\).*/\1/p' weston.log | tail -1)"
          echo "capture display $DISPLAY"
          xrandr --listmonitors
          bun apps/server/scripts/measure-input.ts --out input-proof.json
      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takeover-input-linux-${{ github.run_id }}
          path: |
            input-proof.json
            weston.log
          if-no-files-found: warn

  macos:
    name: paste and click on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install ffmpeg and Chromium
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          node apps/server/node_modules/playwright/cli.js install chromium
      - name: Build the web app
        run: bun run build
      - name: Grant input and screen capture to the daemon
        run: |
          set -euo pipefail
          database="/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
            for client in "$(which bun)" "$(which ffmpeg)"; do
              csreq -r- -b "/tmp/$(basename "$client").req" "$client" || true
              sudo sqlite3 "$database" \
                "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
                 VALUES('${service}','${client}',1,2,4,1,readfile('/tmp/$(basename "$client").req'),NULL,0,'UNUSED',NULL,0,${now});"
            done
          done
          sudo killall tccd 2>/dev/null || true
          sleep 2
          pgrep -lx tccd || sudo launchctl kickstart -k system/com.apple.tccd || true
          sudo sqlite3 "$database" "SELECT service, client, auth_value FROM access WHERE client LIKE '%bun%';"
      - name: Show the capture device and who may record the screen
        run: |
          set -euo pipefail
          which ffmpeg
          ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | head -20 || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT service, client, client_type, auth_value FROM access WHERE service LIKE '%ScreenCapture%' OR service LIKE '%Accessibility%';" || true
          ffmpeg -hide_banner -loglevel error -f avfoundation -capture_cursor 1 -framerate 5 -i "Capture screen 0" -t 2 -f mjpeg -q:v 5 pipe:1 > /tmp/frames.mjpeg 2>/tmp/frames.log || true
          echo "captured $(wc -c < /tmp/frames.mjpeg) bytes"
          cat /tmp/frames.log || true
          ffmpeg -hide_banner -loglevel error -nostdin -f avfoundation -capture_cursor 1 -framerate 15 -i "Capture screen 0" -r 15 -an -vf scale=1024:768:flags=fast_bilinear -c:v mjpeg -q:v 19 -f mjpeg -t 2 pipe:1 > /tmp/daemon.mjpeg 2>/tmp/daemon.log || true
          echo "the daemon's command captured $(wc -c < /tmp/daemon.mjpeg) bytes"
          cat /tmp/daemon.log || true
      - name: Run two captures at once like the daemon
        run: |
          set -euo pipefail
          cat > /tmp/pair.ts <<'TS'
          const FFMPEG = "/opt/homebrew/bin/ffmpeg"
          const head = [FFMPEG, "-hide_banner", "-loglevel", "error", "-nostdin"]
          const source = ["-f", "avfoundation", "-capture_cursor", "1", "-i", "Capture screen 0:none"]
          const scale = ["-vf", "scale=1024:768:flags=fast_bilinear"]
          const h264 = [...head, "-framerate", "30", ...source, "-r", "30", "-an", ...scale, "-c:v", "h264_videotoolbox", "-realtime", "true", "-allow_sw", "1", "-g", "30", "-force_key_frames", "expr:gte(t,n_forced*1)", "-f", "h264", "-t", "5", "pipe:1"]
          const mjpeg = [...head, "-framerate", "15", ...source, "-r", "15", "-an", ...scale, "-c:v", "mjpeg", "-q:v", "18", "-f", "mjpeg", "-t", "5", "pipe:1"]

          const firstChunk = async (args: string[]) => {
            const child = Bun.spawn(args, { stdin: "ignore", stdout: "pipe", stderr: "pipe" })
            const errors = new Response(child.stderr).text().catch(() => "")
            const reader = child.stdout.getReader()
            const bytes = await Promise.race([
              reader.read().then((part) => part.value?.byteLength ?? 0),
              Bun.sleep(8_000).then(() => -1),
            ])
            const tail = bytes === -1 ? (await errors).trim().slice(0, 200) : ""
            return tail ? `${bytes} bytes (${tail})` : `${bytes} bytes`
          }

          const [h264Bytes, mjpegBytes] = await Promise.all([firstChunk(h264), firstChunk(mjpeg)])
          console.log(`together: h264 ${h264Bytes}, mjpeg ${mjpegBytes}`)
          await Bun.sleep(6_000)
          console.log(`mjpeg alone: ${await firstChunk(mjpeg)}`)
          await Bun.sleep(6_000)
          console.log(`h264 alone: ${await firstChunk(h264)}`)
          process.exit(0)
          TS
          bun /tmp/pair.ts
          DISPLAY=:99 bun /tmp/inner.ts
          DISPLAY=:99 KIKO_DRIVER=/tmp/none.sock KIKO_COMPUTER_DIR=/tmp/pc bun /tmp/inner.ts
      - name: Paste a Unicode string and click the display
        run: bun apps/server/scripts/measure-input.ts --single --out input-proof.json
      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takeover-input-macos-${{ github.run_id }}
          path: input-proof.json
          if-no-files-found: warn
