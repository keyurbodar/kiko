name: Bench contenders

on:
  push:
    branches:
      - "t3/cu-*"
    paths:
      - "apps/bench/**"
      - ".github/workflows/bench-contenders.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-contenders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan the matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -euo pipefail
          matrix="$(jq -c '{include: [(.versions | keys)[] as $c | .runners[] as $r | {contender: $c, runner: $r}]}' apps/bench/ci.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  smoke:
    name: ${{ matrix.contender }} on ${{ matrix.runner }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Grant Accessibility and Screen Recording to the bench host
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          host="$(command -v bun)"
          real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$host")"
          database="/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
            sudo sqlite3 "$database" \
              "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
               VALUES('${service}','${real}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,${now});"
          done
          sudo killall tccd 2>/dev/null || true
          sleep 2
          sudo sqlite3 "$database" "SELECT service, client, auth_value FROM access WHERE client = '${real}';"
          {
            echo "host=$host"
            echo "tcc_client=$real"
            echo "services=kTCCServiceAccessibility,kTCCServiceScreenCapture"
            echo "cua_driver_mode=embedded: CUA_DRIVER_EMBEDDED=1 cua-driver serve --embedded --socket, then cua-driver mcp --embedded --socket"
          } | tee "$RUNNER_TEMP/macos-tcc.txt"

      - name: Install the contender
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.contender }}" in
            cua-driver) script="install-cua-driver.sh"; variable="KIKO_BENCH_CUA_DRIVER" ;;
            agent-desktop) script="install-agent-desktop.sh"; variable="KIKO_BENCH_AGENT_DESKTOP" ;;
            agent-browser) script="install-agent-browser.sh"; variable="KIKO_BENCH_AGENT_BROWSER" ;;
            *) echo "unknown contender ${{ matrix.contender }}" >&2; exit 1 ;;
          esac
          bin="$(bash "apps/bench/scripts/$script" | tail -n 1)"
          test -x "$bin"
          echo "$variable=$bin" >> "$GITHUB_ENV"

      - name: Smoke on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool dbus-x11 at-spi2-core python3-gi gir1.2-gtk-3.0 x11-utils
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/dev/null 2>&1 &
          export DISPLAY=:99
          for _ in $(seq 1 100); do
            if xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          export NO_AT_BRIDGE=0
          export CONTENDER="${{ matrix.contender }}"
          export TYPED="$(jq -r .smoke.typed apps/bench/ci.json)"
          export OUT="$RUNNER_TEMP/bench.json"
          dbus-run-session -- bash -euo pipefail -c '
            openbox --sm-disable >/dev/null 2>&1 &
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
              --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>" >/dev/null 2>&1 || true
            bun apps/bench/scripts/smoke.ts --contender "$CONTENDER" --typed "$TYPED" --out "$OUT"
          '

      - name: Smoke on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bun apps/bench/scripts/smoke.ts \
            --contender "${{ matrix.contender }}" \
            --typed "$(jq -r .smoke.typed apps/bench/ci.json)" \
            --out "$RUNNER_TEMP/bench.json"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.runner }}-${{ matrix.contender }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: warn

      - name: Upload the macOS grant record
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-tcc-${{ matrix.contender }}
          path: ${{ runner.temp }}/macos-tcc.txt
          if-no-files-found: warn

  table:
    name: Table
    needs: [plan, smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/results
          pattern: bench-*

      - name: Render the table
        run: bun apps/bench/scripts/contenders-table.ts "$RUNNER_TEMP/results"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-contenders-results
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
